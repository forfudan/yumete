[package]
description = "Markdown (YFM) laid out with proportional fonts and drawn as pictures, for yumete's preview."
edition.workspace = true
license.workspace = true
name = "yumete-mdview"
repository.workspace = true
version.workspace = true

[dependencies]
# **Text layout with the system's own fonts**: parley shapes,
# breaks lines (ICU4X's UAX #14, strict, so no 「，」 at a line's start) and
# finds fonts through fontique, which reads the fonts the system already has:
# nothing is embedded. Apache-2.0 / MIT.
parley = "0.12"
# **Fontconfig opened at run time on Linux**: fontique links
# libfontconfig at build time by default, which a build machine without its
# headers cannot do, and a binary linked to it will not start where it is
# missing. Opened when first asked for, a system without it only has no
# fonts to find. This line exists for its feature; parley pulls fontique in.
fontique = { version = "0.12", features = ["fontconfig-dlopen"] }
# **Drawing on the CPU**: glyphs, rectangles and pictures into an RGBA buffer,
# no GPU and no window. Its default features bring `png` (the formulas come as
# PNG) and `text` (glyphs, colour emoji included). Apache-2.0 / MIT.
vello_cpu = "0.3"
# **Nothing on standard error**, which is the editor's screen: a debug build
# of ICU4X (under parley) prints a missing-data warning for every CJK
# paragraph with `eprintln!` unless its `logging` feature sends it to the
# `log` crate, where no logger is set. Only the feature is wanted.
icu_provider = { version = "2", default-features = false, features = ["logging"] }
# Local pictures in a document: PNG and JPEG only.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# **Characters shaped down a column** for the vertical
# preview: parley lays text across only, so the 漢字 of a vertical page are
# shaped top to bottom here, in the face parley chose, which brings each
# font's vertical forms and metrics (`vert`, `vmtx`, `VORG`). Already under
# parley, at this version. Apache-2.0 / MIT.
harfrust = "0.12"
yumete-cjk = {path = "../yumete-cjk"}
yumete-core = {path = "../yumete-core"}

# **A font file mapped rather than read**, for a family fontconfig's
# matching hides from fontique (`fonts::find_unmatched`). Already under
# fontique, at this version. Apache-2.0 / MIT.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
memmap2 = "0.9"
