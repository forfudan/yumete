en = "interface language: {0}"

[[message]]
# `::` 面板的名字
key = "ui.lookfor"
zhs = "找命令"
en = "look for"

[[message]]
# `::` 剛打開，一個字都還没打
key = "ui.lookfor-empty"
zhs = "说一说它是做什么的——「竖排」「排序」「wrap」都算"
en = "say what it does — 竖排, sort and wrap all count"

[[message]]
# `::` 打了字，可是一條都没找着
key = "ui.lookfor-nothing"
zhs = "没有命令答得上「{0}」"
en = "no command answers 「{0}」"

[[message]]
# `::` 面板的頁腳：第幾條，以及 ⇥ 會把哪一條寫回 `:` 那一行
key = "ui.lookfor-take"
zhs = "{0}　使用 Tab 选择搜索结果，Enter 采用"
en = "{0}   Use Tab to cycle the results, Enter to take one"

[[message]]
# 字典浮窗按不動鍵，長的去邊欄讀
key = "ui.looking-it-up"
zhs = "查着……"
en = "looking it up…"

[[message]]
# 命令面板裏那一條的前提没開
key = "ui.needs-these-first"
zhs = "需要 {0}，句末加 force"
en = "needs {0}; add `!` to the command name to set that up too"

[[message]]
# 這個平台上没有配截圖命令
key = "ui.no-screenshot-command"
zhs = "这个平台上没有截图命令——`[editor] screenshot` 写一条，或用 `:shot html`"
en = "no screenshot command here — write one at `[editor] screenshot`, or `:shot html`"

[[message]]
# 字典欄：碼表根本没載，所以答不出來——和「表裏没有這個字」是兩件事
key = "ui.no-table-yet"
zhs = "码表没载——`:yume-scheme` 载一次"
en = "no 碼表 loaded yet — `:yume-scheme` loads one"

[[message]]
# 字典欄：拆分表裏没有這個字
key = "ui.not-in-the-table"
zhs = "拆分表里没有这个字"
en = "not in the 拆分表"

[[message]]
# 空格 d：光標下没有字可查
key = "ui.nothing-to-look-up"
zhs = "光标下没有字可查"
en = "no character under the cursor to look up"

[[message]]
# 狀態欄的位置：橫排的正文
key = "ui.position"
zhs = "行 {0}, 列 {1}, 字 {2}"
en = "Ln {0}, Col {1}, Chr {2}"

[[message]]
# 狀態欄的位置：光標在表格裏
key = "ui.position-in-table"
zhs = "行 {0}, 列 {1} [{2}]"
en = "Row {0}, Col {1} [{2}]"

[[message]]
# 狀態欄的位置：橫排，擠不下 字 那一格時
key = "ui.position-short"
zhs = "行 {0}, 列 {1}"
en = "Ln {0}, Col {1}"

[[message]]
# 狀態欄的位置：竪排
key = "ui.position-vertical"
zhs = "纵 {0}, 横 {1}, 字 {2}"
en = "Zong {0}, Heng {1}, Chr {2}"

[[message]]
# 狀態欄的位置：竪排，擠不下 字 那一格時
key = "ui.position-vertical-short"
zhs = "纵 {0}, 横 {1}"
en = "Zong {0}, Heng {1}"

[[message]]
# 提示行：`A-k` 只留匹配的
key = "ui.prompt-keep"
zhs = "只留/"
en = "keep:"

[[message]]
# 提示行：`A-K` 去掉匹配的
key = "ui.prompt-remove"
zhs = "去掉/"
en = "remove:"

[[message]]
# 提示行：`:ruby` 改讀音
key = "ui.prompt-ruby"
zhs = "注"
en = "ruby:"

[[message]]
# `/` 搜索那一行的提示詞(helix 寫 search:)
key = "ui.prompt-search"
zhs = "搜索: "
en = "search: "

[[message]]
# `?` 倒着搜那一行的提示詞(helix 寫 rsearch:)
key = "ui.prompt-search-back"
zhs = "倒搜: "
en = "rsearch: "

[[message]]
# `?` 的提示符，同上
key = "ui.prompt-search-back-wild"
zhs = "通配倒搜: "
en = "wide rsearch: "

[[message]]
# `/` 的提示符，繁簡拼音通配開着的時候(`A-j`)
key = "ui.prompt-search-wild"
zhs = "通配搜索: "
en = "wide search: "

[[message]]
# 提示行：`s` 選出匹配
key = "ui.prompt-select"
zhs = "选出/"
en = "select:"

[[message]]
# 命令行：行首是 ! 或 :sh、:pipe 那一族時，畫在打的字前面的標籤
key = "ui.prompt-shell"
zhs = "Shell: "
en = "Shell: "

[[message]]
# 提示行：`S` 按匹配切開
key = "ui.prompt-split"
zhs = "切开/"
en = "split:"

[[message]]
# 狀態欄：這一份是只讀的(:readonly on，或磁盤上就不許寫)
key = "ui.readonly-tag"
zhs = " [只读]"
en = " [read-only]"

[[message]]
# 截圖失敗，帶理由
key = "ui.screenshot-failed"
zhs = "截图失败({0})"
en = "no picture taken ({0})"

[[message]]
# 截圖進了剪貼簿
key = "ui.screenshot-taken"
zhs = "画面已放进剪贴板"
en = "the screen is on the clipboard"

[[message]]
# `/` 與 `?` 那一扇面板的第一行
key = "ui.search-is-a-regex"
zhs = "收的是正则式：`.` 任一字、`.*` 任一串、`^$` 行首行尾"
en = "a regular expression: `.` any character, `.*` any run, `^$` the line's ends"

[[message]]
# `/` 與 `?` 那一扇面板的第二行
key = "ui.search-smart-case"
zhs = "全小写不分大小写；带一个大写就分"
en = "all lower case ignores case; one capital makes it matter"

[[message]]
# `/` 與 `?` 那一扇面板的第三行——那一行上 `A-j` 做什麼。{0} 是那個鍵(`[keys.prompt]` 改得動)
key = "ui.search-wild"
zhs = "{0} 繁简拼音通配开关"
en = "{0} matches across glyph variants and pinyin"

[[message]]
# `:shot` 把這一幀畫成檔案了
key = "ui.shot-drawn"
zhs = "这一页画成了 {0}"
en = "drew this page to {0}"

[[message]]
# `:shot` 寫不出那個檔
key = "ui.shot-failed"
zhs = "写不出这张图：{0}"
en = "could not write the picture: {0}"

[[message]]
# `:shot png` 的那條命令没把圖寫成檔案
key = "ui.shot-kept-the-clipboard"
zhs = "`[editor] screenshot` 那一条没有理会 $YUMETE_SHOT，图还是进了剪贴板"
en = "the `[editor] screenshot` line ignored $YUMETE_SHOT — the picture is on the clipboard"

[[message]]
# `:shot png` 把視窗拍成檔案了
key = "ui.shot-photographed"
zhs = "窗口拍成了 {0}"
en = "photographed the window to {0}"

[[message]]
# 邊欄有焦點，而提示行關着——狀態欄整條讓給邊欄的按鍵
key = "ui.sidebar-mode"
zhs = "-- 边栏 --  {0}"
en = "-- SIDEBAR --  {0}"


# ── wheel ─────────────────────────────────────────────────────────────
