# prefixes: lsp problem code diff vcs git commit conflict
#
# What the editor says, one block per tag; see README.md beside this file.

[[message]]
# mi c：光標不在任何一段註釋裏
key = "code.no-comment-here"
zhs = "光标不在注释中"
en = "the cursor is not inside a comment"

[[message]]
# ]c：這一份裏一段註釋都没有
key = "code.no-comments"
zhs = "本文件没有注释"
en = "no comments in this file"

[[message]]
# mi f/mi c：光標不在任何一個定義裏
key = "code.no-definition-here"
zhs = "光标不在函数或类中"
en = "the cursor is not inside a function or a class"

[[message]]
# ]f/]c：這一份裏一個定義都没有(或者不是代碼檔)
key = "code.no-definitions"
zhs = "本文件没有函数或类"
en = "no functions or classes in this file"

[[message]]
# mi x，可是光標不在 HTML 元素裏
key = "code.no-element-here"
zhs = "光标不在 HTML 元素中"
en = "the cursor is not inside an HTML element"

[[message]]
# mi e，可是光標不在鍵值對裏
key = "code.no-entry-here"
zhs = "光标不在键值对中"
en = "the cursor is not inside a key–value pair"

[[message]]
# mi a：光標不在任何一個參數裏
key = "code.no-parameter-here"
zhs = "光标不在参数中"
en = "the cursor is not inside a parameter"

[[message]]
# ]d：這一份裏一個診斷都没有
key = "code.no-problems"
zhs = "本文件没有诊断"
en = "no diagnostics in this file"

[[message]]
# mi T，可是光標不在測試函數裏
key = "code.no-test-here"
zhs = "光标不在测试函数中"
en = "the cursor is not inside a test function"

[[message]]
# A-o 那一族：這裏没有語法樹
key = "code.no-tree-here"
zhs = "这里没有语法树：不是代码文件，也不在代码块中"
en = "no syntax tree here: not a code file or a code block"

[[message]]
# 上屏方式的名字：预设(由方案自己说了算)
key = "commit.name.default"
zhs = "方案默认"
en = "scheme default"

[[message]]
# 上屏方式的名字：延遲
key = "commit.name.delayed"
zhs = "延迟(顶字)"
en = "delayed (頂字)"

[[message]]
# 上屏方式的名字：整句
key = "commit.name.fluency"
zhs = "整句"
en = "whole-sentence"

[[message]]
# 上屏方式的名字：唯一
key = "commit.name.unique"
zhs = "唯一"
en = "unique"

[[message]]
# 没有這種上屏方式
key = "commit.no-such-method"
zhs = "没有「{0}」这种上屏方式，可选 default、delayed、unique(或 auto)、fluency"
en = "no commit method '{0}'; use default, delayed, unique (or auto) or fluency"

[[message]]
# 這個方案只能整句上屏
key = "commit.scheme-is-sentence-only"
zhs = "{0} 只能整句上屏(没有可逐段查询的码表)，上屏方式仍为{1}"
en = "{0} has no 碼表 to look segments up in, so it commits whole sentences only; the commit method stays {1}"

[[message]]
# 上屏方式換好了
key = "commit.set"
zhs = "上屏方式：{0}"
en = "commit method: {0}"


# ── complete ──────────────────────────────────────────────────────────

[[message]]
# ]c/[c 跳到了第 {0} 行的衝突
key = "conflict.at-line"
zhs = "第 {0} 行的合并冲突"
en = "merge conflict at line {0}"

[[message]]
# 空格 m 之後，衝突化解，留下了 {0} 行
key = "conflict.kept"
zhs = "冲突已解决，保留 {0} 行"
en = "conflict resolved, {0} line(s) kept"

[[message]]
# 空格 m 想回到共同祖先，但檔案裏没有記下它(不是 diff3 樣式)
key = "conflict.no-ancestor"
zhs = "此冲突没有记录共同祖先"
en = "this conflict records no common ancestor"

[[message]]
# ]c 而後面没有衝突了
key = "conflict.no-next"
zhs = "后面没有冲突了"
en = "no conflict after this one"

[[message]]
# [c 而前面没有衝突了
key = "conflict.no-previous"
zhs = "前面没有冲突了"
en = "no conflict before this one"

[[message]]
# ]c/[c/:check-merge 而整份文件裏一處衝突都没有
key = "conflict.none"
zhs = "本文件没有合并冲突"
en = "no merge conflicts in this file"

[[message]]
# 空格 m 而光標不在任何衝突裏
key = "conflict.not-in-one"
zhs = "光标不在冲突里"
en = "the cursor is not in a merge conflict"

[[message]]
# :check-merge 列出了 {0} 處衝突
key = "conflict.some"
zhs = "{0} 处合并冲突"
en = "{0} merge conflict(s)"

[[message]]
# :diff 找到了改動
key = "diff.changed"
zhs = "{0} 行与《{1}》不同，gf 跳转"
en = "{0} line(s) differ from '{1}'; gf jumps there"

[[message]]
# :git-diff 問不出答案：git 自己那一句話照搬
key = "diff.git-said"
zhs = "git 中没有 {0} 版本的此文件：{1}"
en = "git has no version at {0}: {1}"

[[message]]
# :diff 而這個緩衝區没有檔案，也没説要比誰
key = "diff.no-file"
zhs = "此缓冲区还没有文件，请指定比较对象：`:diff <文件名>`"
en = "this buffer has no file yet; name one to compare with: `:diff <path>`"

[[message]]
# :diff 的結果那一份緩衝區的名字
key = "diff.results"
zhs = "[改动 {0} ↔ {1}]"
en = "[changes {0} ↔ {1}]"

[[message]]
# :diff 比下來一模一樣
key = "diff.same"
zhs = "与《{0}》完全相同"
en = "identical to '{0}'"

[[message]]
# :diff 兩份差得太遠，逐詞列出來没有意義
key = "diff.too-far"
zhs = "与《{0}》差异太大，无法逐词比较"
en = "too different from '{0}' to compare word by word"

[[message]]
# :diff 改動太多，只列了前面那些
key = "diff.too-many"
zhs = "与《{1}》有 {0} 行以上不同(只列出前 {0} 行)，gf 跳转"
en = "{0}+ lines differ from '{1}' (first {0} listed); gf jumps there"


# ── edit ──────────────────────────────────────────────────────────────

[[message]]
# :git-show 之後狀態行的一句話
key = "git.show"
zhs = "{0} 版本已在另一个窗口中只读打开"
en = "the version at {0} is open read-only in the other window"

[[message]]
# 代碼動作做完了：哪一個，幾處，幾個檔
key = "lsp.action-done"
zhs = "{0}：在 {2} 个文件中修改了 {1} 处"
en = "{0}: changed {1} place(s) in {2} file(s)"

[[message]]
# 語言服務器要求改檔，改完了：幾處，幾個檔
key = "lsp.applied"
zhs = "语言服务器在 {1} 个文件中修改了 {0} 处"
en = "the language server changed {0} place(s) in {1} file(s)"

[[message]]
# gd 問出去了，還没回話
key = "lsp.asking"
zhs = "正在查询定义…"
en = "looking up the definition…"

[[message]]
# 空格 a 問出去了
key = "lsp.asking-actions"
zhs = "正在查询可用操作…"
en = "looking up code actions…"

[[message]]
# =：請語言服務器排版選區
key = "lsp.asking-format"
zhs = "正在格式化…"
en = "formatting…"

[[message]]
# gr 問出去了
key = "lsp.asking-references"
zhs = "正在查询引用…"
en = "looking up references…"

[[message]]
# :lsp-rename 問出去了
key = "lsp.asking-rename"
zhs = "正在重命名…"
en = "renaming…"

[[message]]
# 空格 k 問出去了，還没回話
key = "lsp.asking-what"
zhs = "正在查询文档…"
en = "looking up the docs…"

[[message]]
# 按 空格 k 的時候：稿子還没存盤，服務器答的是檔案
key = "lsp.buffer-unsaved"
zhs = "此缓冲区未保存，未连接语言服务器"
en = "this buffer has no file yet, so no language server is attached"

[[message]]
# 語言服務器起不來(機器上没裝)——只説一次
key = "lsp.cannot-start"
zhs = "{0} 无法启动({1})：文件照常打开，但没有诊断"
en = "{0} could not start ({1}); the file opens as usual, without diagnostics"

[[message]]
# =：服務器没有要改的
key = "lsp.format-changed-nothing"
zhs = "语言服务器没有要改的地方"
en = "the language server had nothing to change"

[[message]]
# =：一次只排一段選區，同 helix
key = "lsp.format-one-selection"
zhs = "一次只能格式化一个选区"
en = "only one selection can be formatted at a time"

[[message]]
# =：服務器不排，後面是它說的理由
key = "lsp.format-refused"
zhs = "语言服务器拒绝格式化：{0}"
en = "the language server declined to format: {0}"

[[message]]
# =：排好了
key = "lsp.formatted"
zhs = "已格式化"
en = "formatted"

[[message]]
# 起服務器用的是項目自己帶的那一個，不是 PATH 上的
key = "lsp.from-the-project"
zhs = "语言服务器：项目中的 {0}"
en = "language server: {0} from the project"

[[message]]
# 語言服務器起來一下就没了(裝得不完整)
key = "lsp.never-started"
zhs = "{0} 的语言服务器启动后立即退出，可能未正确安装(不再重试)"
en = "the {0} language server exited right after starting; it may not be installed properly (will not retry)"

[[message]]
# 空格 a 問了，服務器說這裏沒什麼可做
key = "lsp.no-actions"
zhs = "此处没有可用的代码操作"
en = "no code actions here"

[[message]]
# 語言服務器起來了、進程活着，卻一直不回 initialize
key = "lsp.no-answer"
zhs = "{0} 的语言服务器已启动，但 {1} 秒未响应"
en = "the {0} language server started but has not responded in {1} seconds"

[[message]]
# 空格 h：服務器没找到這個符號
key = "lsp.no-highlights"
zhs = "此处没有符号"
en = "no symbol here"

[[message]]
# gr 問了，服務器說哪兒都沒用到
key = "lsp.no-references"
zhs = "语言服务器未找到其他引用"
en = "the language server found no other references"

[[message]]
# 按 空格 k 的時候：這個語言在設置裏根本没寫服務器
key = "lsp.no-server-configured"
zhs = "没有为 {0} 配置语言服务器，请在 :settings 中设置"
en = "no language server configured for {0} — set one in :settings"

[[message]]
# 空格 k 按在稿子上——那裏没有語言服務器
key = "lsp.not-code"
zhs = "不是代码文件，没有语言服务器"
en = "not a code file; no language server"

[[message]]
# 按 空格 k 的時候：設置裏寫了，可這臺機器上没有那個程序
key = "lsp.not-installed"
zhs = "找不到 {0}：请检查配置 [lsp] 表中的拼写，或安装它"
en = "{0} not found: check its spelling in the config's [lsp] table, or install it"

[[message]]
# 打開代碼檔時：出廠填好的服務器這臺機器上一個都没有
key = "lsp.not-installed-factory"
zhs = "未安装 {0}，安装后即可使用"
en = "{0} is not installed. Install it to use it here"

[[message]]
# gr、空格 r、空格 a 在沒接語言服務器的文件裏
key = "lsp.not-served"
zhs = "此文件没有语言服务器"
en = "no language server serves this file"

[[message]]
# 服務器提不出任何候選
key = "lsp.nothing-to-offer"
zhs = "此处没有补全"
en = "no completions here"

[[message]]
# gd 問完了，服務器説不出它寫在哪
key = "lsp.nowhere"
zhs = "语言服务器未找到定义"
en = "the language server found no definition"

[[message]]
# :diagnostics-all 頂上那一行的狀態：起來了
key = "lsp.ready"
zhs = "已就绪"
en = "ready"

[[message]]
# 改名的答案是空的
key = "lsp.rename-changed-nothing"
zhs = "语言服务器没有要改的地方"
en = "the language server had nothing to change"

[[message]]
# :lsp-rename 後面沒寫新名
key = "lsp.rename-needs-a-name"
zhs = "请给出新名称：:lsp-rename <新名称>"
en = "give it a new name: :lsp-rename <name>"

[[message]]
# 語言服務器不肯改名，後面是它自己的話
key = "lsp.rename-refused"
zhs = "语言服务器拒绝重命名：{0}"
en = "the language server declined to rename: {0}"

[[message]]
# 改名做完了：幾處，幾個檔
key = "lsp.renamed"
zhs = "已重命名 {0} 处（{1} 个文件）"
en = "renamed {0} place(s) in {1} file(s)"

[[message]]
# gd 問出去之前，服務器還在讀項目(#431)
key = "lsp.server-starting"
zhs = "语言服务器正在启动，请稍候"
en = "the language server is starting; please wait"

[[message]]
# 打 `(` 那一下浮出來的那一扇的名字。它與「文檔」(空格 k)本質不同
# ——同一個地方兩種問題，名字要分得開。回退到 hover 的時候框裏是一段文檔，
# 標題仍寫這個：它説的是「你剛打了一個括號」這個場合，不是框裏裝的是什麼。
key = "lsp.signature"
zhs = "签名"
en = "Signature"

[[message]]
# 服務器對光標下那個東西無話可説
key = "lsp.speechless"
zhs = "此处没有文档"
en = "no documentation here"

[[message]]
# 按 空格 k 的時候：試過了，起不來，此後不再試
key = "lsp.start-failed"
zhs = "语言服务器启动失败"
en = "the language server failed to start"

[[message]]
# 按 空格 k 的時候：服務器正在起
key = "lsp.starting"
zhs = "正在启动语言服务器…"
en = "the language server is starting…"

[[message]]
# 語言服務器死了
key = "lsp.stopped"
zhs = "{0} 的语言服务器已停止，之前的结果不再可靠；打开下一个文件时会重新启动"
en = "the {0} language server stopped; its results no longer count, and the next file starts a new one"

[[message]]
# 補全單子底下那一句：怎麽用
key = "lsp.take-it"
zhs = "Tab 补全 · C-n/C-p 选择"
en = "Tab to complete · C-n/C-p to choose"

[[message]]
# gd 跳到了定義那一行
key = "lsp.went"
zhs = "{0} 第 {1} 行(C-o 返回)"
en = "{0} line {1} (C-o to go back)"


# ── macro ─────────────────────────────────────────────────────────────

[[message]]
# :diagnostics-all 頂上那一行：名字　路徑　狀態
key = "lsp.where-it-is"
zhs = "{0}  {1}  {2}"
en = "{0}  {1}  {2}"

[[message]]
# 補全單子底下：第幾條/一共幾條(單子露不全的時候)
key = "lsp.which-of-them"
zhs = "{0}/{1} · Tab 补全"
en = "{0}/{1} · Tab to complete"

[[message]]
# 語言服務器説的一句話有多響：最響的那一檔
key = "problem.error"
zhs = "错误"
en = "error"

[[message]]
# :diagnostics-all 列完了，一共幾處
key = "problem.found"
zhs = "{0} 个问题，gf 跳到该行"
en = "{0} problem(s); gf jumps to the line"

[[message]]
# 最輕的那一檔：「你也許想知道」
key = "problem.hint"
zhs = "提示"
en = "hint"

[[message]]
# :diagnostics-all 但還没有任何服務器説過話
key = "problem.none"
zhs = "语言服务器尚未报告问题"
en = "no language server has reported anything"

[[message]]
# 光標這一行上服務器一句話都没説(按 空格 i 的時候)
key = "problem.none-here"
zhs = "本行没有诊断"
en = "nothing reported on this line"

[[message]]
# 中間那兩檔之一：服務器順帶説的一句話
key = "problem.note"
zhs = "说明"
en = "note"

[[message]]
# :diagnostics-all 的單子上一行：哪個檔、第幾行、多響、説了什麼
key = "problem.one"
zhs = "{0}:{1}: {2} {3}"
en = "{0}:{1}: {2} {3}"

[[message]]
# :diagnostics-all 的緩衝區標題
key = "problem.results"
zhs = "诊断"
en = "diagnostics"

[[message]]
# :diagnostics-all 的單子太長，只列了前面那些
key = "problem.too-many"
zhs = "问题过多，只列出前 {0} 个"
en = "too many; showing the first {0}"

[[message]]
# 中間那兩檔之一：不至於錯，但值得看一眼
key = "problem.warn"
zhs = "警告"
en = "warning"

[[message]]
# 診斷浮框脚下那一行：怎麽看全部
key = "problem.whole-list"
zhs = "␣I 打开侧栏"
en = "␣I opens the sidebar"


# ── progress ──────────────────────────────────────────────────────────

[[message]]
# ]g/[g：這一份根本没有改動
key = "vcs.nothing-changed"
zhs = "本文件没有改动"
en = "nothing has changed in this file"
