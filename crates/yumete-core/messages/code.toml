key = "code.no-entry-here"
zht = "光標不在任何鍵值對裏"
zhs = "光标不在任何键值对里"
en = "the cursor is not inside a key–value pair"

[[message]]
# mi a：光標不在任何一個參數裏
key = "code.no-parameter-here"
zht = "光標不在任何參數裏"
zhs = "光标不在任何参数里"
en = "the cursor is not inside a parameter"

[[message]]
