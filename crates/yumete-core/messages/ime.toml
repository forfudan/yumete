zhs = "每页 {0} 个候选"
en = "{0} candidates per page"

[[message]]
# :yume-menu-size：一頁只剩一條的時候（英文要單數）
key = "ime.menu-size-is-one"
zhs = "每页 {0} 个候选"
en = "{0} candidate per page"

[[message]]
