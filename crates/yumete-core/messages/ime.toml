# prefixes: ime yume chaifen language scheme annotation
#
# What the editor says, one block per tag; see README.md beside this file.

[[message]]
# 注解的一欄：設置面板注解模式那一頁的一行（取自 yume）
key = "annotation.field.chaifen"
zhs = "拆分"
en = "拆分"

[[message]]
# 注解的一欄：設置面板注解模式那一頁的一行（取自 yume）
key = "annotation.field.charset"
zhs = "字集"
en = "character set"

[[message]]
# 注解的一欄：設置面板注解模式那一頁的一行（取自 yume）
key = "annotation.field.code"
zhs = "编码"
en = "code"

[[message]]
# 注解的一欄：設置面板注解模式那一頁的一行（取自 yume）
key = "annotation.field.full-chaifen"
zhs = "全息拆分"
en = "full 拆分"

[[message]]
# 注解的一欄：設置面板注解模式那一頁的一行（取自 yume）
key = "annotation.field.note"
zhs = "字义"
en = "meaning"

[[message]]
# 注解的一欄：設置面板注解模式那一頁的一行（取自 yume）
key = "annotation.field.reading"
zhs = "拼音"
en = "reading"

[[message]]
# 注解的一欄：設置面板注解模式那一頁的一行（取自 yume）
key = "annotation.field.simp-trad"
zhs = "简繁"
en = "simp./trad."

[[message]]
# 注解的一欄：設置面板注解模式那一頁的一行（取自 yume）
key = "annotation.field.unicode"
zhs = "Unicode"
en = "Unicode"

[[message]]
# 注解模式的名字：yume 出廠的二重注解（取自 yume）
key = "annotation.mode.double"
zhs = "二重"
en = "double"

[[message]]
# 注解模式的名字：yume 出廠的多重注解（取自 yume）
key = "annotation.mode.multi"
zhs = "多重"
en = "multi"

[[message]]
# 注解模式的名字：關
key = "annotation.mode.off"
zhs = "关"
en = "off"

[[message]]
# 拼音的注解開着（拼音畫自己的欄目，不分模式）
key = "annotation.mode.on"
zhs = "开"
en = "on"

[[message]]
# 狀態欄：換了注解模式，或 :yume-annotation 問現在是哪一個
key = "annotation.now"
zhs = "注解：{0}"
en = "annotation: {0}"

[[message]]
# 狀態欄：拼音下注解開或關
key = "annotation.pinyin-now"
zhs = "拼音模式注解：{0}"
en = "pinyin annotation: {0}"

[[message]]
# 狀態欄：這個方案没有注解可畫
key = "annotation.unavailable"
zhs = "此方案没有注解"
en = "this scheme has no annotations"

[[message]]
# 狀態欄：:yume-annotation 後面的名字不是一個模式
key = "annotation.unknown"
zhs = "没有 {0} 这种注解模式，可选：{1}"
en = "no annotation mode {0}; available: {1}"

[[message]]
# :lint 查一張拆分表，兩行用了同一個行名
key = "chaifen.duplicate-row-name"
zhs = "{0}: 行名「{1}」与第 {2} 行重复"
en = "{0}: row name '{1}' duplicates row {2}"

[[message]]
# :check table 走到一行，它的引號没關上——下一行是同一條記錄
key = "chaifen.field-runs-on"
zhs = "{0}: 引号未闭合，记录跨到了下一行；此表每行只能有一条记录"
en = "{0}: unclosed quote; the record runs onto the next line, and this table takes one record per line"

[[message]]
# :lint 的結果那一份緩衝區的名字
key = "chaifen.lint-results"
zhs = "[检查 {0}]"
en = "[lint {0}]"

[[message]]
# :lint 查一張拆分表，某一行的欄數和表頭對不上
key = "chaifen.wrong-column-count"
zhs = "{0}: 此行有 {1} 列，应为 {2} 列"
en = "{0}: {1} columns here, {2} expected"

# ── check ─────────────────────────────────────────────────────────────

[[message]]
# Shift 點一下切到 ABC：yume 還接着鍵盤，按鍵直通
key = "ime.abc"
zhs = "ABC：按键直接输入，按一下 Shift 回到中文"
en = "ABC: keys type as is; tap Shift for Chinese"

[[message]]
# :yume-autocompletion ——輸入預測此刻開着還是關着
key = "ime.autocompletion-is"
zhs = "输入预测：{0}"
en = "prediction: {0}"

[[message]]
# :yume ! 切到編進二進制的那一份碼表(`! 方案名` 指定哪一家)
key = "ime.builtin-scheme"
zhs = "方案：{0}(内置码表)"
en = "scheme: {0} (built-in 碼表)"

[[message]]
# `:yume-charset` 撥了或問了之後：現在是哪一檔。{0} 是檔名（宇夢的字串「過濾：」）
key = "ime.charset-is"
zhs = "过滤：{0}"
en = "filter: {0}"

[[message]]
# `:yume-charset` 等三條後面跟了一個認不出的詞。{0} 是那個詞
key = "ime.charset-no-such"
zhs = "无法识别 {0}"
en = "no such value: {0}"

[[message]]
# 字集過濾：全部漢字（宇夢的字串）
key = "ime.charset.all"
zhs = "全部汉字"
en = "all characters"

[[message]]
# 字集過濾：僅常用漢字（宇夢的字串）
key = "ime.charset.common"
zhs = "仅常用汉字"
en = "common characters only"

[[message]]
# 字集過濾：僅傳統漢字（宇夢的字串）
key = "ime.charset.harmonic"
zhs = "仅传统汉字"
en = "traditional only"

[[message]]
# 字集過濾：僅簡化漢字（宇夢的字串）
key = "ime.charset.tonggui"
zhs = "仅简化汉字"
en = "simplified only"

[[message]]
# 輸入法切到中文
key = "ime.chinese"
zhs = "中文({0})"
en = "Chinese ({0})"

[[message]]
# 狀態欄右端：Insert 模式，輸入法在中文那一邊
key = "ime.chinese-tag"
zhs = "[中 {0}]"
en = "[中 {0}]"

[[message]]
# 整句字集軌：common 那一軌的名字（宇夢的字串）
key = "ime.lane.common"
zhs = "常用繁简汉字"
en = "common characters, both scripts"

[[message]]
# `:yume-lanes`：首軌那一條名字後面加的（宇夢的字串）
key = "ime.lane.first"
zhs = "（首轨）"
en = ", first"

[[message]]
# 整句字集軌：gang 那一軌的名字（宇夢的字串）
key = "ime.lane.gang"
zhs = "香港常用字"
en = "Hong Kong common characters"

[[message]]
# 整句字集軌：guji 那一軌的名字（宇夢的字串）
key = "ime.lane.guji"
zhs = "古籍通用规范汉字"
en = "general standard for ancient texts"

[[message]]
# 整句字集軌：harmonic 那一軌的名字（宇夢的字串）
key = "ime.lane.harmonic"
zhs = "调和传统汉字"
en = "harmonized traditional"

[[message]]
# `:yume-lanes` 報各軌時，兩個軌名之間的那個
