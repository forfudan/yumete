zhs = "、"
en = ", "

[[message]]
# 整句字集軌：tai 那一軌的名字（宇夢的字串）
key = "ime.lane.tai"
zhs = "常用与次常用国字"
en = "Taiwan common characters"

[[message]]
# 整句字集軌：tongfan 那一軌的名字（宇夢的字串）
key = "ime.lane.tongfan"
zhs = "通规标准繁体字"
en = "standard traditional"

[[message]]
# 整句字集軌：tonggui 那一軌的名字（宇夢的字串）
key = "ime.lane.tonggui"
zhs = "通用规范汉字"
en = "general standard (simplified)"

[[message]]
# `:yume-lanes` 撥了或問了之後：各軌依次。{0} 是軌名，用頓號連起來，首軌帶「（首軌）」（宇夢的字串）
key = "ime.lanes-is"
zhs = "整句字集轨：{0}"
en = "sentence lanes: {0}"

[[message]]
# 碼表載入要十分之幾秒，那一格畫在動手之前(#341)
key = "ime.loading"
zhs = "正在加载码表…"
en = "loading the 碼表…"

[[message]]
# :yume-menu-size ——候選面板一頁幾條
