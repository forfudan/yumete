zhs = "方案：{0}(系统安装的码表)"
en = "scheme: {0} (system-installed 碼表)"

[[message]]
# :yume-scheme 換好了方案
key = "ime.scheme-now"
zhs = "方案：{0}"
en = "scheme: {0}"

[[message]]
