# prefixes: check wiki links link note maths
#
# What the editor says, one block per tag; see README.md beside this file.

[[message]]
# :check-charset 查完，每個字都在某個字集裏
key = "check.charset-clean"
zhs = "{0}：每个字都在字集里"
en = "{0}: every character is in a character set"

[[message]]
# :check-charset 查出了不在任何字集裏的字
key = "check.charset-found"
zhs = "{0} 个字不在任何字集中，gf 跳到该行"
en = "{0} character(s) in no character set; gf jumps to the line"

[[message]]
# :check-charset 没有字集資料可問(碼表没載)
key = "check.charset-no-data"
zhs = "没有字集数据，请先用 :yume-scheme 加载方案"
en = "no character-set data — load a scheme first with :yume-scheme"

[[message]]
# :check-charset 結果裏的一行：這個字不在任何字集裏
key = "check.charset-outside"
zhs = "{0}: 「{1}」不在任何字集里({2})，全文 {3} 处"
en = "{0}: 「{1}」 is in no character set ({2}); {3} times in the file"

[[message]]
# :check-charset 的結果那一份緩衝區的名字
key = "check.charset-results"
zhs = "[字集 {0}]"
en = "[charset {0}]"

[[message]]
# :check-charset 查出來的太多，只列了前面那些
key = "check.charset-too-many"
zhs = "{0} 个以上(只列出前 {0} 个)，gf 跳到该行"
en = "{0}+ characters in no character set (first {0} listed); gf jumps to the line"

[[message]]
# :check-names 查完，稿子裏每一處專名都寫對了
key = "check.names-clean"
zhs = "{0}：专名都写对了"
en = "{0}: every name spelled as the wiki has it"

[[message]]
# :check-names 查出了寫錯一個字的專名
key = "check.names-found"
zhs = "{0} 处专名错了一个字，gf 跳到该行"
en = "{0} name(s) one character off; gf jumps to the line"

[[message]]
# :check-names 要讀音表纔分得出「同音寫錯」和「本來就是别的詞」，而它没裝
key = "check.names-no-readings"
zhs = "查不到读音：没有读音表就分不出「同音错字」和「本来就是别的词」(用 `:yume-scheme` 加载)"
en = "no readings: without them a misspelt name cannot be told from a different word (`:yume-scheme` loads them)"

[[message]]
# :check-names 這本書還没有百科，没有名字可比
key = "check.names-no-wiki"
zhs = "本项目还没有百科，用 :wiki-edit 创建后才能检查专名"
zht = "本項目還没有百科，用 :wiki-edit 創建後纔能檢查專名"
en = "this project has no wiki yet; :wiki-edit starts one, then names can be checked"

[[message]]
# :check-names 的緩衝區標題
key = "check.names-results"
zhs = "{0} 的专名"
en = "names in {0}"

[[message]]
# :check-names 查出來的一處：這裏寫的、百科裏的名字、以及差的那一個字
key = "check.names-slip"
zhs = "{0}: 这里是「{1}」，百科里是「{2}」({3} → {4}，同音)"
en = "{0}: 「{1}」 here, 「{2}」 in the wiki ({3} → {4}, same sound)"

[[message]]
# :check-names 查出來的太多，只列了前面那些
key = "check.names-too-many"
zhs = "过多，只列出前 {0} 处"
en = "too many; the first {0} are listed"

[[message]]
# :check-punct 查完，標點没有問題
key = "check.punct-clean"
zhs = "{0}：标点没有问题"
en = "{0}: punctuation is clean"

[[message]]
# :check-punct 結果裏的一行：半角的三點該是六點省略號
key = "check.punct-ellipsis"
zhs = "{0}: 「{1}」该是「……」"
en = "{0}: 「{1}」 should be 「……」"

[[message]]
# :check-punct 查出了要看一眼的標點
key = "check.punct-found"
zhs = "{0} 处标点需要检查，gf 跳到该行"
en = "{0} mark(s) to check; gf jumps to the line"

[[message]]
# :check-punct 結果裏的一行：中文裏的半角標點
key = "check.punct-half"
zhs = "{0}: 半角「{1}」该是「{2}」"
en = "{0}: half-width 「{1}」 should be 「{2}」"

[[message]]
# :check-punct 的結果那一份緩衝區的名字
key = "check.punct-results"
zhs = "[标点 {0}]"
en = "[punctuation {0}]"

[[message]]
# :check-punct 查出來的太多，只列了前面那些
key = "check.punct-too-many"
zhs = "{0} 处以上(只列出前 {0} 处)，gf 跳到该行"
en = "{0}+ marks to check (first {0} listed); gf jumps to the line"

[[message]]
# :check-punct 結果裏的一行：開了口没有收尾的引號或括號
key = "check.punct-unclosed"
zhs = "{0}: 「{1}」缺少配对的「{2}」"
en = "{0}: 「{1}」 is never closed by 「{2}」"

[[message]]
# :check-punct 結果裏的一行：收尾的標點前面没有開口
key = "check.punct-unopened"
zhs = "{0}: 「{1}」前面没有「{2}」"
en = "{0}: 「{1}」 with no 「{2}」 before it"

[[message]]
# :check-usage 查完，全文用字一致
key = "check.usage-clean"
zhs = "{0}：用字一致"
en = "{0}: one spelling throughout"

[[message]]
# :check-usage 查出了不一致的用字
key = "check.usage-found"
zhs = "{0} 处用字不一致，gf 跳到该行"
en = "{0} inconsistent spelling(s); gf jumps to the line"

[[message]]
# :check-usage 的結果那一份緩衝區的名字
key = "check.usage-results"
zhs = "[用字 {0}]"
en = "[usage {0}]"

[[message]]
# :check-usage 結果裏的一行：這裏寫的和全文多數不一樣
key = "check.usage-slip"
zhs = "{0}: 这里是「{1}」{3} 次，全文多用「{2}」{4} 次"
en = "{0}: 「{1}」 here ({3}), 「{2}」 in the rest ({4})"

[[message]]
# :check-usage 查出來的太多，只列了前面那些
key = "check.usage-too-many"
zhs = "{0} 处以上(只列出前 {0} 处)，gf 跳到该行"
en = "{0}+ inconsistent spellings (first {0} listed); gf jumps to the line"


