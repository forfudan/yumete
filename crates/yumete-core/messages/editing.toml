# prefixes: edit selection word words convert ruby register macro count complete inline-preedit comment change shell command
#
# What the editor says, one block per tag; see README.md beside this file.

[[message]]
# 空格 x：光標那一行没改過
key = "change.none-here"
zhs = "本行没有改动"
en = "nothing changed on this line"

[[message]]
# 命令行語法壞了
key = "command.broken-line"
zhs = "命令有误：{0}"
en = "invalid command line: {0}"


# ── commit ────────────────────────────────────────────────────────────

[[message]]
# 純文本没有注釋這回事，兩個鍵都這麼説
key = "comment.none"
zhs = "纯文本没有注释"
en = "plain text has no comments"

[[message]]
# 這種注釋不能套另一個注釋：裏面的 --> 會提前結束它
key = "comment.would-nest"
zhs = "选区内已有注释，HTML 注释不能嵌套"
en = "the selection already has a comment, and <!-- --> comments cannot nest"

[[message]]
# 補全面板裏這一條的説明：這個號碼還没人用，選它就是開一條新註
key = "complete.a-new-one"
zhs = "新建"
en = "new"

[[message]]
# [@ 和 Typst 的 @ 那一格補全面板的名字
key = "complete.citation"
zhs = "文献"
en = "citation"

[[message]]
# 補全：面板叫什麼——附近的檔案
