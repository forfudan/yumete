key = "config.whole-file-dropped"
zht = "這一條讓整份配置都没生效，用的是出廠設置"
zhs = "这一条让整份配置都没生效，用的是出厂设置"
en = "this one line stops the whole file applying; the factory settings are in use"

[[message]]
# 設置面板：存不下去({0} ＝ 為什麽)
key = "settings.cannot-save"
zht = "存不下去：{0}"
zhs = "存不下去：{0}"
en = "cannot save: {0}"

