# prefixes: settings config
#
# What the editor says, one block per tag; see README.md beside this file.

[[message]]
# :check-config 查完了，兩個檔都没毛病({0} 是查了幾個檔)
key = "config.check-clean"
zht = "配置檔没毛病(查了 {0} 個)"
zhs = "配置档没毛病(查了 {0} 个)"
en = "the config is clean ({0} file(s) checked)"

[[message]]
# :check-config 查出來幾條
key = "config.check-found"
zht = "配置檔有 {0} 處"
zhs = "配置档有 {0} 处"
en = "{0} thing(s) wrong in the config"

[[message]]
# :check-config 查出來的那一頁的名字
key = "config.check-name"
zht = "配置檔的毛病"
zhs = "配置档的毛病"
en = "config problems"

[[message]]
# :reload-config 讀到的設定檔有毛病
key = "config.reload-said"
zht = "設定重讀了，但有話説：{0}"
zhs = "设置重读了，但有话説：{0}"
en = "settings reloaded, with something to say: {0}"

[[message]]
# :reload-config 做完了
key = "config.reloaded"
zht = "設定重讀了"
zhs = "设置重读了"
en = "settings reloaded"

[[message]]
