# prefixes: settings config
#
# What the editor says, one block per tag; see README.md beside this file.

[[message]]
# :check-config 查完了，兩個檔都没毛病({0} 是查了幾個檔)
key = "config.check-clean"
zhs = "配置无误(检查了 {0} 个文件)"
en = "config OK ({0} file(s) checked)"

[[message]]
# :check-config 查出來幾條
key = "config.check-found"
zhs = "配置有 {0} 处问题"
en = "{0} problem(s) in the config"

[[message]]
# :check-config 查出來的那一頁的名字
key = "config.check-name"
zhs = "配置问题"
en = "config problems"

[[message]]
# :config-open 時前端没說配置檔在哪
key = "config.no-file"
zhs = "找不到配置文件位置"
en = "config file location unknown"

[[message]]
# :reload-config 讀到的設定檔有毛病
key = "config.reload-said"
zhs = "已重新加载设置，但有提示：{0}"
en = "settings reloaded, with a note: {0}"

[[message]]
# :reload-config 做完了
key = "config.reloaded"
zhs = "已重新加载设置"
en = "settings reloaded"

[[message]]
