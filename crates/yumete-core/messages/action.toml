key = "keys.flavor.item.helix-fold-keys"
zhs = "helix 下的折叠键"
en = "fold keys under helix"

[[message]]
# 風味項：helix 下的折疊鍵的說明
key = "keys.flavor.item.helix-fold-keys.hint"
zhs = "开：helix 下也能用 vim 的 za 开合折叠、zR 全部展开、zM 全部折叠，zf 把选中的行折叠。关：未绑定，只能用命令折叠。"
en = "On: vim's za, zR and zM under helix (open or close a fold, open all, close all); zf makes a fold of the selected lines. Off: unbound; folds by command only."

[[message]]
# 風味的一項：設置面板上的名字
key = "keys.flavor.item.helix-keys-under-vim"
zhs = "借用 helix 的键"
en = "helix's keys"

[[message]]
# 風味的一項：設置面板上的說明
key = "keys.flavor.item.helix-keys-under-vim.hint"
zhs = "开：vim 下在 vim 没用的键上借用 helix 的键：Alt 键、C-s、Z、gb、gy 等。关：同 vim，这些键不起作用。"
en = "On: under vim, helix's keys on the keys vim leaves free: the Alt keys, C-s, Z, gb, gy and more. Off: they do nothing, as in vim."

[[message]]
