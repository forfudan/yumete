en = "the Space menu"

[[message]]
# 風味的一項：設置面板上的說明（草稿）
key = "keys.flavor.item.vim-space-menu.hint"
zht = "開：vim 下空格打開空格菜單。關：空格同 vim 往右走一格，空格菜單改用反斜線打開。"
zhs = "开：vim 下空格打开空格菜单。关：空格同 vim 往右走一格，空格菜单改用反斜线打开。"
en = "On: under vim, Space opens the Space menu. Off: Space moves right as in vim, and the backslash opens the menu."

[[message]]
# 風味的一項：設置面板上的名字（草稿）
key = "keys.flavor.item.x-selects-upward"
zht = "往上選行"
zhs = "往上选行"
en = "select the line above"

[[message]]
# 風味的一項：設置面板上的說明（草稿）
key = "keys.flavor.item.x-selects-upward.hint"
zht = "開：X 往上選一行，再按再多選一行，同 x 往下。關：helix 的 X，把選區擴到整行。"
zhs = "开：X 往上选一行，再按再多选一行，同 x 往下。关：helix 的 X，把选区扩到整行。"
en = "On: X selects the line above, one more each press, as x does downward. Off: helix's X, which extends the selection to whole lines."

[[message]]
# 同上，關着那一頭
key = "keys.flavor.off"
zht = "關閉"
zhs = "关闭"
en = "off"

[[message]]
# 風味的兩個狀態詞——不用共用那對「開/關」，這一行是整句讀的
key = "keys.flavor.on"
zht = "開啟"
zhs = "开启"
en = "on"

[[message]]
# 按出來的那一串在這一層裏没有綁任何東西
key = "keys.no-such-combination"
zht = "{0} 爲無效按鍵組合，請重試"
zhs = "{0} 为无效按键组合，请重试"
en = "{0} is not a key combination here — try again"

[[message]]
# vim 預設下，`d` `c` `y` 等的是一個動作，而按下的那個鍵不是
key = "keys.not-a-motion"
zht = "`{0}` 不是一個動作——d、c、y 等的是動作(w、e、$、G、f、i…)"
zhs = "`{0}` 不是一个动作——d、c、y 等的是动作(w、e、$、G、f、i…)"
en = "`{0}` is not a motion — d, c and y are waiting for one"

[[message]]
# :keymap — 現在是 helix
key = "keys.preset-helix"
zht = "鍵位：helix(出廠)"
zhs = "键位：helix(出厂)"
en = "keymap: helix (default)"

[[message]]
# :keymap — 現在是 vim
key = "keys.preset-vim"
zht = "鍵位：vim——x X 剪字、s 改一個字、V 選行、dd yy cc dw cw、^ $ 0"
zhs = "键位：vim——x X 剪字、s 改一个字、V 选行、dd yy cc dw cw、^ $ 0"
en = "keymap: vim — x X cut a character, s changes one, V selects the line, dd yy cc dw cw, ^ $ 0"
