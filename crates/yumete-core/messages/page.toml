en = "pages, vertical: one (a column runs the whole page)"

[[message]]
# :indent-tab spaces — Tab 打空格
key = "layout.tab-spaces"
zhs = "Tab 键：用空格补到下一个 {0} 的倍数(Shift-Tab 插入制表符)"
