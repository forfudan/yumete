key = "blame.line"
zhs = "{0}，{1} • {2}"
en = "{0}, {1} • {2}"

[[message]]
# :view-blame 行末那一句里的时间：几分钟前提交的（草稿）
key = "blame.minutes-ago"
zhs = "{0} 分钟前"
en = "{0|minute|minutes} ago"

[[message]]
