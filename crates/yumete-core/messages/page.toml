# prefixes: layout vertical-keys wrap hard-wrap rulers page view sentence level wheel md render blame
#
# What the editor says, one block per tag; see README.md beside this file.

[[message]]
# 鼠标停在 :view-blame 画的那一句上，浮窗里提交人那一栏的名字（草稿）
key = "blame.author"
zhs = "作者"
en = "author"

[[message]]
# 鼠标停在 :view-blame 画的那一句上，浮窗的标题：{0} 是提交号的前八位（草稿）
key = "blame.commit"
zhs = "提交 {0}"
en = "commit {0}"

[[message]]
# 鼠标停在 :view-blame 画的那一句上，浮窗里提交时间那一栏的名字（草稿）
key = "blame.date"
zhs = "时间"
en = "date"

[[message]]
# :view-blame 行末那一句里的时间：几天前提交的（草稿）
key = "blame.days-ago"
zhs = "{0} 天前"
en = "{0|day|days} ago"

[[message]]
