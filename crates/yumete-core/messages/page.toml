# prefixes: layout vertical-keys wrap hard-wrap rules page view sentence level wheel md render
#
# What the editor says, one block per tag; see README.md beside this file.

[[message]]
# :hard-wrap 做完了：幾行變幾行，寬多少
key = "hard-wrap.done"
zhs = "{0} 行 → {1} 行，宽 {2}"
en = "{0} lines → {1}, width {2}"

[[message]]
# :hard-wrap 0 做完了：幾行併成幾行
key = "hard-wrap.joined"
zhs = "{0} 行合并为 {1} 行"
en = "{0} lines joined into {1}"

[[message]]
# :hard-wrap 不選區時光標站在標題、代碼、空行上
key = "hard-wrap.nothing"
zhs = "本行没有可重排的段落"
en = "nothing to reflow on this line"

[[message]]
# :hard-wrap 不帶數字，而設置裏也沒設
key = "hard-wrap.unset"
zhs = "未设宽度：输入 :hard-wrap 50，或在设置里填写 hard_wrap"
en = "no width set: use :hard-wrap 50, or set hard_wrap in the settings"

[[message]]
# :vertical/-v 碰上一份程序文件——縮進是那門語言的語法，竪排讀不了
key = "layout.code-is-horizontal"
zhs = "代码文件总是横排；其他文本的竖排不受影响"
en = "code files are always horizontal; your text stays vertical"

[[message]]
# :view-code off — 圍欄裏的代碼回到一種顏色
key = "layout.code-off"
zhs = "代码高亮：关(代码块单色)"
en = "code highlighting: off (code blocks in one colour)"

[[message]]
# :view-code on — 圍欄裏的代碼按語法上色；{0} 是認得的語言，從 Language::ALL 現數的
key = "layout.code-on"
zhs = "代码高亮：开(支持 {0})"
en = "code highlighting: on (supports {0})"

[[message]]
# :view-code 報告裏：光標所在這一段代碼太長，超過上限所以只畫一種顏色
key = "layout.code-too-long"
zhs = "此代码块 {0} 行，超过 {1} 行不高亮"
en = "this block has {0} lines; over {1}, it is not highlighted"

[[message]]
# :view-diff on，可是這個文件不在 git 倉里，或者倉里还没有第一个提交——
# 开了什么都不画，当场説出来，别让人以为是坏了
key = "layout.diff-gutter-not-in-git"
zhs = "改动条：开(此文件不在 git 中，不会显示)"
en = "diff gutter: on (file not in git; nothing shown)"

[[message]]
# :view-diff off
key = "layout.diff-gutter-off"
zhs = "改动条：关"
en = "diff gutter: off"

[[message]]
# :view-diff on——行號旁邊那一格開始用底色説 git 的改動
key = "layout.diff-gutter-on"
zhs = "改动条：开(绿＝新增，蓝＝修改，红色细线＝删除)"
en = "diff gutter: on (green added, blue changed, thin red line deleted)"

[[message]]
# `:view-diagnostics` 之後：行末診斷現在畫到哪一級。{0} 檔名
key = "layout.eol-diagnostics"
zhs = "行末诊断：{0}"
en = "end-of-line diagnostics: {0}"

[[message]]
# :indent full — 縮進畫出來，段間的空行也收起
key = "layout.first-line-indent-folded"
zhs = "首行缩进：{0} 格，收起段间空行"
en = "first-line indent: {0} cells, blank lines hidden"

[[message]]
# :indent basic — 縮進畫出來，段間的空行不收
key = "layout.first-line-indent-kept"
zhs = "首行缩进：{0} 格，保留段间空行"
en = "first-line indent: {0} cells, blank lines kept"

[[message]]
# 首行縮進關掉
key = "layout.first-line-indent-off"
zhs = "首行缩进：关"
en = "first-line indent: off"

[[message]]
# 焦點模式關掉
key = "layout.focus-off"
zhs = "焦点：关"
en = "focus: off"

[[message]]
# 焦點模式打開
key = "layout.focus-on"
zhs = "焦点：开(其余内容变淡)"
en = "focus: on (the rest dims)"

[[message]]
# 排版換成橫排
key = "layout.horizontal"
zhs = "排版：横排"
en = "layout: horizontal"

[[message]]
# 標點旁置關掉
key = "layout.hung-punctuation-off"
zhs = "标点旁置：关(每个标点占一格)"
en = "hanging punctuation: off (each mark takes a cell)"

[[message]]
# 標點旁置打開
key = "layout.hung-punctuation-on"
zhs = "标点旁置：开"
en = "hanging punctuation: on"

[[message]]
# 縮進標記換了畫法
key = "layout.indent-hint"
zhs = "段首记号：{0}"
en = "paragraph mark: {0}"

[[message]]
# :indent-width — 報告或改了縮進寬度
key = "layout.indent-width"
zhs = "缩进宽度：{0} 格"
en = "indent width: {0}"

[[message]]
# 行號那一條有自己的底色
key = "layout.line-numbers-on-a-band"
zhs = "行号：有底色"
en = "line numbers: with background"

[[message]]
# 行號那一條没有底色
key = "layout.line-numbers-on-the-page"
zhs = "行号：无底色"
en = "line numbers: no background"

[[message]]
# `:view-long-line off`——没有上限(vim 的 `synmaxcol=0`)
key = "layout.long-line-off"
zhs = "长行也高亮"
en = "every line is highlighted, however long"

[[message]]
# `:view-long-line N` ——門槛開著的時候狀態欄那一句
key = "layout.long-line-on"
zhs = "超过 {0} 字的行不高亮"
en = "lines past {0} characters are not highlighted"

[[message]]
# `:view-margin always`
key = "layout.margin-always"
zhs = "夹行：总是(每一纵、每一行都留)"
en = "margin: always (every column and row)"

[[message]]
# `:view-margin dense`
key = "layout.margin-dense"
zhs = "夹行：按视觉纵(只在有内容的纵/行留)"
en = "margin: dense (only columns or rows that carry something)"

[[message]]
# `:view-margin loose`
key = "layout.margin-loose"
zhs = "夹行：按逻辑行(段内有一处，整段都留)"
en = "margin: loose (a whole paragraph, if any of it carries something)"

[[message]]
# `:view-margin never`
key = "layout.margin-never"
zhs = "夹行：从不(不显示注音、旁置标点、着重号、平仄)"
en = "margin: never (no readings, hanging marks, emphasis dots or 平仄)"

[[message]]
# :measure 定了欄寬
key = "layout.measure-columns"
zhs = "正文宽度：{0} 列"
en = "text width: {0} columns"

[[message]]
# :measure 交回窗口寬
key = "layout.measure-window"
zhs = "正文宽度：随窗口"
en = "text width: follows the window"

[[message]]
# 平仄開了，可是没有讀音表
key = "layout.meter-no-readings"
zhs = "平仄：开，但没有读音表，夹行将为空"
en = "平仄: on, but with no reading data the margin will be empty"

[[message]]
# 平仄關掉
key = "layout.meter-off"
zhs = "平仄：关"
en = "平仄: off"

[[message]]
# 平仄打開
key = "layout.meter-on"
zhs = "平仄：开(○平 ●仄 △▲韵脚)"
en = "平仄: on (○ 平, ● 仄, △▲ 韻腳)"

[[message]]
# 標點提示打開了，可是 :render off 不畫任何檔案裏没有的東西
key = "layout.note-no-render"
zhs = "标点提示：开，但 :render off 时页面上不画文件里没有的字"
en = "punctuation hints: on, but `:render off` shows nothing the file does not contain"

[[message]]
# 標點提示關掉
key = "layout.note-off"
zhs = "标点提示：关"
en = "punctuation hints: off"

[[message]]
# 標點提示打開
key = "layout.note-on"
zhs = "标点提示：开(在半角标点和 ... 旁显示应使用的标点)"
en = "punctuation hints: on (the right mark shown beside half-width ones)"

[[message]]
# 橫排分成幾欄
key = "layout.pages-horizontal"
zhs = "分栏：{0} 栏"
en = "pages, horizontal: {0}"

[[message]]
