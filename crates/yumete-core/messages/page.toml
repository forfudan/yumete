key = "wheel.is"
zhs = "滚轮：每格 {0} 行(`:wheel 1` 为终端默认)"
en = "wheel: {0|line|lines} per notch (`:wheel 1` is the terminal's own)"

[[message]]
# 滾輪一格走多遠——設好了
key = "wheel.set"
zhs = "滚轮：每格 {0} 行"
en = "wheel: {0|line|lines} per notch"


# ── word ──────────────────────────────────────────────────────────────

[[message]]
# 折行關掉
key = "wrap.off"
zhs = "自动换行：关(长行不换行，视图随光标横向滚动)"
en = "soft wrap: off (long lines stay on one row; the view follows the cursor)"

[[message]]
# 折行打開
key = "wrap.on"
zhs = "自动换行：开"
en = "soft wrap: on"

[[message]]
# :view-wrap on/off 用在竪排下（草稿）
key = "wrap.vertical-has-no-wrap"
zhs = "竖排不自动换行：一纵在窗口高度处断开。此项只用于横排(每纵字数用 `:view-wrap-height` 设)"
en = "vertical text does not soft-wrap: a column breaks at the window height. This setting is for horizontal text (`:view-wrap-height` sets the column length)"
