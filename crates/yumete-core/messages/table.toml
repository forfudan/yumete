# prefixes: table cell
#
# What the editor says, one block per tag; see README.md beside this file.

[[message]]
# 表格模式下往格子裏打分隔符(拆分表是製表符，Markdown 是 |)
key = "cell.refuses-delimiter"
zhs = "「{0}」是分隔符，单元格中不能使用"
en = "'{0}' is the cell separator; a cell cannot contain it"

[[message]]
# 表格模式下往格子裏貼或打一個換行
