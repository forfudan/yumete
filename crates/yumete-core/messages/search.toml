# ── help ──────────────────────────────────────────────────────────────

[[message]]
# gw：這一屏上没有可以跳的地方
key = "jump.nowhere"
zht = "這一屏上没有可以跳的地方"
zhs = "这一屏上没有可以跳的地方"
