# prefixes: search find substitute seek lookfor goto jump toc
#
# What the editor says, one block per tag; see README.md beside this file.

[[message]]
# :s 的模式是空的
key = "find.empty-pattern"
zhs = "搜索内容为空"
en = "empty pattern"

[[message]]
# 把檔名與一句話連起來
key = "find.file-and-message"
zhs = "{0}：{1}"
en = "{0}: {1}"

[[message]]
# helix 的 f/t 跨行往後找，到文件尾都没有
key = "find.no-such-character-ahead"
zhs = "后面没有「{0}」"
en = "no '{0}' ahead"

[[message]]
# helix 的 F/T 跨行往前找，到文件頭都没有
key = "find.no-such-character-behind"
zhs = "前面没有「{0}」"
en = "no '{0}' behind"

[[message]]
# f/F 在全窗表格的本格裏找不到那個字(全窗裏「這一行」是「這一格」)
key = "find.no-such-character-in-this-cell"
zhs = "本单元格中没有「{0}」"
en = "no '{0}' in this cell"

[[message]]
# f/F 在本行找不到那個字
key = "find.no-such-character-on-this-line"
zhs = "本行没有「{0}」"
en = "no '{0}' on this line"

[[message]]
# :s 的行號超出這一份的行數
key = "find.no-such-line"
zhs = "本文件只有 {1} 行，没有第 {0} 行"
en = "this file has only {1} lines; there is no line {0}"

[[message]]
# 表格裏一欄一欄地找，没找到
key = "find.not-found"
zhs = "找不到：{0}"
en = "not found: {0}"

[[message]]
# 格視圖下搜不到：説清楚只搜了這張表(#354)
key = "find.not-in-table"
zhs = "本表中没有「{0}」，按 `t q` 退出后再搜全文"
en = "'{0}' is not in this table; ␣t q leaves it to search the rest"

[[message]]
# 在本頁找，光標下没有字
key = "find.nothing-here-to-look-for"
zhs = "这里没有可搜索的文字"
en = "nothing here to search for"

[[message]]
# n/N 之前一次都没搜索過
key = "find.nothing-searched-yet"
zhs = "还没有搜索过：用 / 搜索，或选中内容后按 g/"
en = "no search yet: / searches, or select text and press g/"

[[message]]
# 在本頁找，只有光標這一處
key = "find.only-here"
zhs = "只有这一处：{0}"
en = "only one match: {0}"

[[message]]
# :s 的範圍兩頭寫反了(照 vim，問一句再改)
key = "find.range-runs-backwards"
zhs = "范围是反向的：第 {0} 行到第 {1} 行。y 对调后执行，n 取消"
en = "the range runs backwards: line {0} to {1}; y swaps and runs, n cancels"

[[message]]
# :s 換好了，報處數
key = "find.substitute-changed"
zhs = "替换了 {0} 处"
en = "replaced {0}"

[[message]]
# :s 找到了但一處也没改
key = "find.substitute-nothing-changed"
zhs = "{0} 处(未替换)"
en = "{0} found, nothing replaced"


# ── goto ──────────────────────────────────────────────────────────────

[[message]]
# 在跳轉表裏前後走
key = "goto.jump-list-position"
zhs = "跳转表 {0}/{1}"
en = "jump list {0}/{1}"

[[message]]
# 按了 ga 可是剛纔那一份已經關掉了
key = "goto.last-file-was-closed"
zhs = "上一个文件已关闭"
en = "the last file has been closed"

[[message]]
# 標記所在的緩衝區已經關了
key = "goto.mark-buffer-closed"
zhs = "标记「{0}」所在的缓冲区已关闭"
en = "the buffer holding mark '{0}' is closed"

[[message]]
# 跳到别的檔案裏的標記
key = "goto.mark-in-another-file"
zhs = "「{0}」：{1} 第 {2} 行"
en = "'{0}': {1} line {2}"

[[message]]
# 跳到本檔案裏的標記
key = "goto.mark-in-this-file"
zhs = "「{0}」"
en = "'{0}'"

[[message]]
# 設記號時給的名字不是單個字母或數字
key = "goto.mark-name-one-character"
zhs = "标记名须是一个字母或数字"
en = "a mark is named by one letter or digit"

[[message]]
# 設下一個記號
key = "goto.mark-set"
zhs = "已标记「{0}」：{1} 第 {2} 行"
en = "marked '{0}': {1} line {2}"

[[message]]
# g, 走到頭了：已經在最新那一處改動上
key = "goto.newest-change"
zhs = "已是最新改动"
en = "this is the newest change"

[[message]]
# 跳轉表已經到最早
key = "goto.no-earlier-jump"
zhs = "没有更早的位置了"
en = "no earlier jump"

[[message]]
# 按標題跳，整份没有標題
key = "goto.no-headings"
zhs = "这个文件没有标题"
en = "no headings in this file"

[[message]]
# 按了 ga 可是這一趟還没換過檔
key = "goto.no-last-file"
zhs = "还没打开过别的文件"
en = "no other file opened yet"

[[message]]
# 跳轉表已經到最晚
key = "goto.no-later-jump"
zhs = "没有更晚的位置了"
en = "no later jump"

[[message]]
# gm 找不到別的改過的檔
key = "goto.no-modified-file"
zhs = "还没有改过别的文件"
en = "no other file has been changed"

[[message]]
# 跳到一個没設過的記號
key = "goto.no-such-mark"
zhs = "没有标记「{0}」"
en = "no mark '{0}'"

[[message]]
# 按了 g. 可是這一份稿子這一趟還没改過
key = "goto.nothing-changed-yet"
zhs = "本文件还没有改动"
en = "nothing has been changed here yet"

[[message]]
# 按標題序號跳，序號超出標題數
key = "goto.only-n-headings"
zhs = "只有 {0} 个标题"
en = "only {0} heading(s)"


# ── help ──────────────────────────────────────────────────────────────

[[message]]
# gw：這一屏上没有可以跳的地方
key = "jump.nowhere"
zhs = "本屏没有可跳转的位置"
en = "nowhere on this screen to jump to"

[[message]]
# C-s：把這個選區記進跳轉表，C-o 回得來
key = "jump.selection-saved"
zhs = "已记下此处，C-o 返回"
en = "saved; C-o returns here"

[[message]]
# `::` 那一行按了 ⇥/⏎，可是一條都没找着
key = "lookfor.nothing-to-take"
zhs = "没有匹配的命令：换个说法，或退格回到 `:`"
en = "no matching command; try other words, or backspace to `:`"


# ── lsp ──────────────────────────────────────────────

[[message]]
# 跨檔替換做到一半按了 Esc：接着做下去的那一條
key = "search.abort-go-on"
zhs = "继续替换"
en = "go on replacing"

[[message]]
# 同上：停在這裏，已經換掉的留着
key = "search.abort-keep"
zhs = "停止并保留已替换的内容"
en = "stop and keep what has been replaced"

[[message]]
# 同上：停在這裏，已經換掉的全撤回
key = "search.abort-undo"
zhs = "全部撤销"
en = "stop and undo everything"

[[message]]
# 跨檔替換做到一半按了 Esc，問那一句
key = "search.abort-what"
zhs = "已替换 {0} 个文件，确定停止吗？"
en = "replaced in {0} file(s) so far; stop here?"

[[message]]
# 搜索面板底下那一塊：這一處換完長什麼樣。寫在一道雙橫線的左端。
key = "search.after"
zhs = "替换预览"
en = "preview"

[[message]]
# 空的位置框上那句灰字
key = "search.ask.folder"
zhs = "输入文件夹路径"
en = "type a folder path"

[[message]]
# 空的搜索框上那句灰字
key = "search.ask.query"
zhs = "搜索内容"
en = "search for"

[[message]]
# 空的替換框上那句灰字
key = "search.ask.replace"
zhs = "替换为"
en = "replace with"

[[message]]
# 搜索面板：包含/排除裏有一條寫錯了
key = "search.bad-glob"
zhs = "包含/排除中有无效的通配符，搜索未执行"
en = "only: or except: has a bad glob; search not run"

[[message]]
# 搜索：正則寫不通
key = "search.bad-pattern"
zhs = "正则无效"
en = "bad pattern"

[[message]]
# 搜索：大小寫那一格的名字
key = "search.case"
zhs = "大小写"
en = "case"

[[message]]
# 搜索：大小寫——不敏感
key = "search.case.insensitive"
zhs = "忽略"
en = "ignore"

[[message]]
# 搜索：大小寫——敏感
key = "search.case.sensitive"
zhs = "区分"
en = "match"

[[message]]
# 搜索：大小寫——智能(打大寫纔算數)
key = "search.case.smart"
zhs = "智能"
en = "smart"

[[message]]
# 搜索面板第二行：簡繁異體與拼音合成一行
key = "search.chinese"
zhs = "中文匹配"
en = "Chinese"

[[message]]
# 中文匹配的一半：簡繁異體
key = "search.chinese.glyphs"
zhs = "繁简"
en = "variants"

[[message]]
# 中文匹配的另一半：拼音
key = "search.chinese.pinyin"
zhs = "拼音"
en = "pinyin"

[[message]]
# 搜索：跨檔要按 Enter 纔去找
key = "search.enter-to-look"
zhs = "Enter 搜索"
en = "Enter to search"

[[message]]
# 搜索面板第九個開關：連隱藏文件和被忽略的一起搜
key = "search.hidden"
zhs = "不搜"
en = "skip"

[[message]]
# 不搜那一行方框裏列的：不搜哪些。四態，按 7 轉一格
key = "search.hidden.what"
zhs = "隐藏+忽略"
en = "hidden+ignored"

[[message]]
# 第二態：點文件仍然跳過，.gitignore 裏的那些搜
key = "search.hidden.what.hidden"
zhs = "隐藏"
en = "hidden"

[[message]]
# 第三態：點文件搜，.gitignore 仍然尊重
key = "search.hidden.what.ignored"
zhs = "忽略"
en = "ignored"

[[message]]
# 第四態：什麼都搜。寫一個字而不是留空——空方框像「没加載到」
key = "search.hidden.what.nothing"
zhs = "无"
en = "nothing"

[[message]]
# 限定一欄搜到第一處
key = "search.hit-in-column"
zhs = "第 {0} 列：第 1/{1} 处"
en = "column {0}: hit 1/{1}"

[[message]]
# 限定欄範圍搜到第一處
key = "search.hit-in-column-range"
zhs = "第 {0}–{1} 列：第 1/{2} 处"
en = "columns {0}–{1}: hit 1/{2}"

[[message]]
# t1,5,9/ ——逐欄點名，不是一段範圍
key = "search.hit-in-columns"
zhs = "第 {0} 列：第 1/{1} 处"
en = "columns {0}: hit 1/{1}"

[[message]]
# 搜到第幾處，共幾處
key = "search.hit-n-of-m"
zhs = "第 {0}/{1} 处(n N 下/上一处)"
en = "hit {0} of {1} — n next, N previous"

[[message]]
# 搜索：找到幾處。⚠ **和 `search.hits-more` 一格一格對齊**：那一則
# 是「{0}+結果」，所以這一則的中間是**一個空格**，搜完的那一刻只有 `+` 變成空格，
# 數字和「結果」兩個字一格都不動。
key = "search.hits"
zhs = "{0} 个结果"
en = "{0} results"

[[message]]
# 搜索面板：没走完就停了，數目後面加一個加號
key = "search.hits-more"
zhs = "{0}+ 个结果"
en = "{0}+ results"

[[message]]
# 只找到一處。中文不分單複數，英文分——「1 results」每搜一個獨一無二的詞就出現一次
key = "search.hits-one"
zhs = "{0} 个结果"
en = "{0} result"

[[message]]
# 搜索面板：排除那一格的名字
key = "search.label.exclude"
zhs = "排除: "
en = "except: "

[[message]]
# 搜索面板：包含那一格的名字
key = "search.label.include"
zhs = "包含: "
en = "only: "

[[message]]
# 搜索面板：查詢框的名字
key = "search.label.query"
zhs = "搜: "
en = "Search: "

[[message]]
# 搜索面板：替換框的名字
key = "search.label.replace"
zhs = "换: "
en = "Repl: "

[[message]]
# 搜索面板：「哪裏找」那一格的名字，畫在標題後面
key = "search.label.scope"
zhs = "位置: "
en = "In: "

[[message]]
# 搜索面板第三行：字面/正則/模糊三選一
key = "search.matching"
zhs = "匹配模式"
en = "matching"

[[message]]
# 匹配方式之三：差不多是這幾個字
key = "search.matching.fuzzy"
zhs = "模糊"
en = "fuzzy"

[[message]]
# 匹配方式之一(出廠)：打什麼就找什麼
key = "search.matching.plain"
zhs = "字面"
en = "literal"

[[message]]
# 匹配方式之二：當成正則式子讀
key = "search.matching.regex"
zhs = "正则"
en = "regex"

[[message]]
# 搜索：那一處已經不在那裏了(檔案後來被改過)
key = "search.moved-on"
zhs = "那一处已不在原位，请重新搜索"
en = "that match has moved; search again"

[[message]]
# 表格没指定跳轉範圍，從第一欄起搜
key = "search.no-jump-scope"
zhs = "此表格文件未指定跳转范围，从第一列开始搜索：第 1/{0} 处"
en = "this table sets no jump scope, so the search starts at the first column: hit 1 of {0}"


# ── selection ─────────────────────────────────────────────────────────

[[message]]
# 搜索：説了一個不存在的文件夾
key = "search.no-such-folder"
zhs = "没有这个文件夹：{0}"
en = "no such folder: {0}"

[[message]]
# 搜索：一處都没有
key = "search.none"
zhs = "无结果"
en = "none"

[[message]]
# 搜索：走到第幾處，一共幾處
key = "search.nth-hit"
zhs = "{0}/{1}"
en = "{0}/{1}"

[[message]]
# 搜索：窗口太窄，擺不下面板，退回行內搜索
key = "search.panel-too-narrow"
zhs = "窗口过窄，改用行内搜索"
en = "window too narrow — searching on the line instead"

[[message]]
# 搜索面板底下那一行：走查走到哪了(§5.101，2026-10-07 作者定的文案)
key = "search.progress"
zhs = "已搜索 {0} 个文件，正在搜索 {1}"
en = "{0} files searched, searching {1}"

[[message]]
# 搜索：全部替換動得太多，中央那扇窗問一次——「繼續替換」
key = "search.replace-all-go"
zhs = "全部替换"
en = "Replace all"

[[message]]
# 搜索：同上，「取消替換」
key = "search.replace-all-no"
zhs = "取消"
en = "Cancel"

[[message]]
# 搜索：同上，取消之後説的那一句
key = "search.replace-all-stopped"
zhs = "未替换任何内容"
en = "Nothing was replaced"

[[message]]
# 搜索：同上，正文({0} 幾個檔、{1} 幾處)
key = "search.replace-all-what"
zhs = "将替换 {0} 个文件中的 {1} 处。"
en = "this will replace {1} match(es) in {0} file(s)."

[[message]]
# 整個檔要不要全換，先問一句
key = "search.replace-file-sure"
zhs = "替换 {1} 中的全部 {0} 处？"
en = "replace all {0} match(es) in {1}?"

[[message]]
# 搜索面板第七行三態之二：打什麼就寫什麼(出廠)
key = "search.replace.literal"
zhs = "字面替换"
en = "as typed"

[[message]]
# 搜索面板第七行三態之一：不替換
key = "search.replace.off"
zhs = "关"
en = "off"

[[message]]
# 搜索面板第七行三態之三：換上去的跟着原文的大小寫
key = "search.replace.smart"
zhs = "智能大小写"
en = "keep case"

[[message]]
# 搜索：換掉了幾處
key = "search.replaced"
zhs = "共替换 {0} 处(:wa 保存全部)"
en = "replaced {0} match(es) (:wa saves them all)"

[[message]]
# 搜索：換掉了幾處，有幾個只讀的檔没換
key = "search.replaced-skipping"
zhs = "共替换 {0} 处，跳过 {1} 个只读文件(:wa 保存全部)"
en = "replaced {0} match(es), skipped {1} read-only file(s) (:wa saves them all)"

[[message]]
# 搜索面板那個開關：勾上就長出替換行
key = "search.replacing"
zhs = "替换"
en = "replace"

[[message]]
# 搜索：全部替換正在做，已經做到第幾個檔
key = "search.replacing-progress"
zhs = "正在替换 {0}/{1} 个文件"
en = "replacing {0}/{1} files"

[[message]]
# 搜索：正在走磁盤
key = "search.scanning"
zhs = "正在搜索…"
en = "searching…"

[[message]]
# 位置那一格是四選一，不是輸入框
key = "search.scope-is-a-pick"
zhs = "位置为四选一：按 6 或 ← → 切换；要指定文件夹，用 :search <文件夹>"
en = "In: is one of four: 6 or ← → changes it; `:search <folder>` names a folder"

[[message]]
# 站在結果上按了改字的鍵
key = "search.that-edits-the-box"
zhs = "这些键编辑的是搜索框。要去该处编辑正文，按 Enter"
en = "those keys edit the search box — press Enter to go and edit the text there"

[[message]]
# 搜索：同上，「全部撤銷」
key = "search.undo-all-go"
zhs = "全部撤销"
en = "Undo all"

[[message]]
# 搜索：同上，「不撤銷」
key = "search.undo-all-no"
zhs = "取消"
en = "Cancel"

[[message]]
# 搜索：同上，只撤名單上高亮那一行那一份({0} 它的名字)
key = "search.undo-all-one"
zhs = "只撤销 {0}"
en = "Undo {0} only"

[[message]]
# 搜索：撤回一次跨檔替換，中央那扇窗問一次——正文({0} 幾個檔、{1} 幾處)
key = "search.undo-all-what"
zhs = "撤销全部替换(共 {0} 个文件 {1} 处)？"
en = "Undo the whole replacement — {1} matches in {0} files?"

[[message]]
# 撤回了剛纔那一次替換
key = "search.undone"
zhs = "已撤销刚才的替换"
en = "the replacement was undone"

[[message]]
# 搜索：撤回之後，有幾個檔因為後來又改過而没撤。名字由呼叫方接在後面，一行一個
