key = "search.undone-but-changed"
zhs = "下列文件之后有改动，未撤销。其余文件已撤销替换。"
en = "These files were changed afterwards and were left alone. The rest were undone."

[[message]]
# 撤回了剛纔那一次替換，動了好幾個檔
key = "search.undone-files"
zhs = "已撤销刚才的替换，{0} 个文件均已复原"
en = "replacement undone in all {0} files"

[[message]]
# 搜索：同上那扇窗唯一那顆按鈕
key = "search.undone-ok"
zhs = "知道了"
en = "Got it"

[[message]]
# 搜索：在哪裏找——這個檔
key = "search.where.buffer"
zhs = "本文件"
en = "this file"

[[message]]
# 搜索面板：範圍＝緩衝區
key = "search.where.buffers"
zhs = "缓冲区"
en = "open buffers"

[[message]]
# 位置那一格的第四檔：自己打一個文件夾
key = "search.where.named"
zhs = "指定文件夹…"
en = "a folder…"

[[message]]
# 搜索面板：範圍＝項目路徑
key = "search.where.project"
zhs = "项目"
en = "the project"

[[message]]
# 搜索面板：範圍＝工作路徑
key = "search.where.working"
zhs = "工作目录"
en = "working directory"

[[message]]
# 搜索：完整匹配那一格
key = "search.whole"
zhs = "全词匹配"
en = "whole word"

[[message]]
# `go` 開着、還在等那兩個字母時，命令行上那一句。{0} ＝ 已經打進去的，没打是空的。
key = "seek.ask-letters"
zhs = "输入两个字母{0}"
en = "type two letters{0}"

[[message]]
# `gu` 開着、還在等讀音時，命令行上那一句。
key = "seek.ask-reading"
zhs = "输入拼音{0}"
en = "type a reading{0}"

[[message]]
# 候選面板每一行末尾那個數：「那個字在這一屏上有幾處」。
# 不能只寫數字——行首的序號也是數字，兩個數並排讀者分不出哪個是哪個
# 。
key = "seek.places"
zhs = "共 {0} 处"
en = "{0} place(s)"

[[message]]
# :s …c 走完之後的結語
key = "substitute.confirm-done"
zhs = "替换了 {0} 处，跳过 {1} 处"
en = "{0} replaced, {1} skipped"

[[message]]
# :s …c 停在一處匹配上問換不換({0} 是原文，{1} 是要寫進去的)
key = "substitute.confirm-this-one"
zhs = "「{0}」→「{1}」？y 替换、n 跳过、a 替换其余、q 停止、l 替换后停止"
en = "'{0}' → '{1}'? y replace  n skip  a all the rest  q stop  l this one then stop"

[[message]]
# :s 的行號範圍把兩種寫法混在了一起
key = "substitute.range-not-one-thing"
zhs = "范围只能是一段(1-40)或几行(1,5,9)，不能混用"
en = "a range is one span (1-40) or one list (1,5,9), not a mixture"

[[message]]
# :s 的旗標裏有一個不認得的字母
key = "substitute.unknown-flag"
zhs = "未知标志 '{0}'(g 整行全部、i 忽略大小写、f 按字面、c 逐处确认、n 只计数、t 允许改列数、y 拼音、j 繁简)"
en = "unknown flag '{0}' (g every match on the line, i ignore case, f literal, c ask at each one, n count only, t let the column count change, y pinyin, j glyph variants)"


# ── table ─────────────────────────────────────────────────────────────

[[message]]
# :toc 報有幾條標題
key = "toc.headings-found"
zhs = "大纲：{0} 个标题(:toc 3 跳到第三个)"
en = "outline: {0} heading(s) (:toc 3 goes straight to the third)"


# ── tutor ─────────────────────────────────────────────────────────────
