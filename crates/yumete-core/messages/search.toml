# prefixes: search find substitute seek lookfor goto jump toc
#
# What the editor says, one block per tag; see README.md beside this file.

[[message]]
# :s 的模式是空的
key = "find.empty-pattern"
zht = "模式是空的"
zhs = "模式是空的"
en = "the pattern is empty"

[[message]]
# 把檔名與一句話連起來
key = "find.file-and-message"
zht = "{0}：{1}"
zhs = "{0}：{1}"
en = "{0}: {1}"

[[message]]
# helix 的 f/t 跨行往後找，到文件尾都没有
key = "find.no-such-character-ahead"
zht = "往後找不到「{0}」"
zhs = "往后找不到「{0}」"
en = "no '{0}' anywhere ahead"

[[message]]
# helix 的 F/T 跨行往前找，到文件頭都没有
key = "find.no-such-character-behind"
zht = "往前找不到「{0}」"
zhs = "往前找不到「{0}」"
en = "no '{0}' anywhere behind"

[[message]]
# f/F 在全窗表格的本格裏找不到那個字(全窗裏「這一行」是「這一格」)
key = "find.no-such-character-in-this-cell"
zht = "這一格裏没有「{0}」"
zhs = "这一格里没有「{0}」"
en = "no '{0}' in this cell"

[[message]]
# f/F 在本行找不到那個字
key = "find.no-such-character-on-this-line"
zht = "這一行上没有「{0}」"
zhs = "这一行上没有「{0}」"
en = "no '{0}' on this line"

[[message]]
# :s 的行號超出這一份的行數
key = "find.no-such-line"
zht = "這一份只有 {1} 行，没有第 {0} 行"
zhs = "这一份只有 {1} 行，没有第 {0} 行"
en = "this one has {1} lines, so there is no line {0}"

[[message]]
# 表格裏一欄一欄地找，没找到
key = "find.not-found"
zht = "找不到：{0}"
zhs = "找不到：{0}"
en = "not found: {0}"

[[message]]
# 格視圖下搜不到：説清楚只搜了這張表(#354)
key = "find.not-in-table"
zht = "這張表裏没有「{0}」——`t q` 出去再搜全文"
zhs = "这张表里没有「{0}」——`t q` 出去再搜全文"
en = "「{0}」 is not in this table — ␣t q leaves the grid to search the rest"

[[message]]
# 在本頁找，光標下没有字
key = "find.nothing-here-to-look-for"
zht = "這裏没有字可以找"
zhs = "这里没有字可以找"
en = "nothing here to look for"

[[message]]
# n/N 之前一次都没搜索過
key = "find.nothing-searched-yet"
zht = "還没有搜索過——先用 / 搜索，或者選中一段按 g/"
zhs = "还没有搜索过——先用 / 搜索，或者选中一段按 g/"
en = "nothing has been searched for yet — / searches, or select something and press g/"

[[message]]
# 在本頁找，只有光標這一處
key = "find.only-here"
zht = "只有這一處：{0}"
zhs = "只有这一处：{0}"
en = "only here: {0}"

[[message]]
# :s 的範圍兩頭寫反了(照 vim，問一句再改)
key = "find.range-runs-backwards"
zht = "範圍數字是反向的：第 {0} 行到第 {1} 行——y 對調着改、n 不動"
zhs = "范围数字是反向的：第 {0} 行到第 {1} 行——y 对调着改、n 不动"
en = "the range runs backwards: line {0} to line {1} — y swaps and changes, n leaves it"

[[message]]
# :s 換好了，報處數
key = "find.substitute-changed"
zht = "換了 {0} 處"
zhs = "换了 {0} 处"
en = "changed {0} hit(s)"

[[message]]
# :s 找到了但一處也没改
key = "find.substitute-nothing-changed"
zht = "{0} 處(没有改)"
zhs = "{0} 处(没有改)"
en = "{0} hit(s), nothing changed"


