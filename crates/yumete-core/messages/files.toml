[[message]]
# 搶救回來的自動存檔副本，那一份緩衝區的名字
key = "recover.draft-name"
zhs = "草稿 {0}"
en = "draft {0}"

[[message]]
# 打開本檔案的搶救稿
key = "recover.draft-opened"
zhs = "抢救稿开好了——:w 留下它，u 回到原来那份"
en = "the draft is open — :w keeps it, u goes back"

[[message]]
# 啓動時救回没存的草稿
key = "recover.drafts-opened"
zhs = "打开了 {0} 份没存的草稿——:w <名字> 留下它们"
en = "opened {0} unsaved draft(s) — :w <name> keeps them"

[[message]]
# 啓動時發現有没存的草稿
key = "recover.drafts-waiting"
zhs = "有 {0} 份没存的草稿——:recover 打开"
en = "{0} unsaved draft(s) — :recover opens them"

[[message]]
# 那一問上選了「暫時不管」或「取消」之後
key = "recover.left-for-now"
zhs = "你可以之后再次使用 :recover 命令来进行文档恢复"
en = "you can run :recover later to recover the document"

[[message]]
# 本檔案没有搶救稿
key = "recover.no-draft-for-this-file"
zhs = "这个文件没有抢救稿"
en = "no draft for this file"

[[message]]
# 自動存搶救稿失敗，帶系統理由
key = "recover.no-draft-kept"
zhs = "没有留抢救稿——{0}"
en = "no draft kept — {0}"


# ── register ──────────────────────────────────────────────────────────

[[message]]
# 重讀失敗
key = "reload.failed"
zhs = "重读不了：{0}"
en = "cannot re-read: {0}"


# ── render ────────────────────────────────────────────────────────────

[[message]]
# 安全核驗的第一個選項：照存
key = "write.oversize-go"
zhs = "继续保存"
en = "save it"

[[message]]
# 安全核驗的第二個選項：先看改了什麼(＝ :diff)，這一存不做
key = "write.oversize-look"
zhs = "查看区别"
en = "see what changed"

[[message]]
# 安全核驗的第三個選項：不存
key = "write.oversize-no"
zhs = "取消保存"
en = "cancel"

[[message]]
# 安全核驗答了「取消儲存」(或按 Esc)之後説的話
key = "write.oversize-stopped"
zhs = "没存——磁盘上那一份原封不动"
en = "not saved — the file on disk is untouched"

[[message]]
# 安全核驗那扇窗的標題(:write 發現這一存把檔案撐大了很多)
key = "write.oversize-title"
zhs = "安全核验"
en = "safety check"

[[message]]
# 安全核驗的正文：説數字，不説「幅度較大」
key = "write.oversize-what"
zhs = "这一存会把《{0}》从 {1} 变成 {2}，{3} 倍。"
en = "saving would take 《{0}》 from {1} to {2} — {3}× as big."
