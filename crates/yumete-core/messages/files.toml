# prefixes: buffer file recover write readonly reload autoreload recent export cd data progress
#
# What the editor says, one block per tag; see README.md beside this file.

[[message]]
# 外面改了，你這裏也改了
key = "autoreload.both-changed"
zht = "文件被外部修改，你也有所改動。可使用 :reload! 丟棄你的更改"
zhs = "文件被外部修改，你也有所改动。可使用 :reload! 丢弃你的更改"
en = "the file changed outside and you have changes too — `:reload!` throws yours away"

[[message]]
# 外面改了，自動重讀完成
key = "autoreload.reread"
zht = "文件被外部修改，已同步加載 {0}"
zhs = "文件被外部修改，已同步加载 {0}"
en = "the file changed outside; re-read {0}"

[[message]]
# 自動重讀開關換好了
key = "autoreload.set"
zht = "文件被外部修改則自動同步加載：{0}"
zhs = "文件被外部修改则自动同步加载：{0}"
en = "auto re-read on outside change: {0}"


