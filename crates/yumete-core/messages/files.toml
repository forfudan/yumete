zhs = "此文件还没有名字，无法记录进度，请先保存"
en = "this file has no name yet, so progress cannot be recorded; save it first"

[[message]]
# :count-progress 但 .yumete/progress.tsv 還一天都没有
key = "progress.nothing-yet"
zhs = "还没有记录：保存一次，今天就开始计数"
en = "nothing recorded yet: save once to start counting today"

[[message]]
# :count-progress 的結果，没有設每日目標
key = "progress.report"
zhs = "今天 {0} 字，项目 {1} 字，连续 {2} 天"
en = "{0} words today, {1} in the project, {2}-day streak"

[[message]]
# :count-progress 的結果，設了每日目標
key = "progress.report-target"
zhs = "今天 {0}/{1} 字({2}%)，项目 {3} 字，连续 {4} 天"
en = "{0}/{1} words today ({2}%), {3} in the project, {4}-day streak"

[[message]]
# :count-progress 開出來的那一頁的標題
key = "progress.results"
zhs = "写作进度"
en = "progress"

[[message]]
# :count-target off——不再對着目標算
key = "progress.target-cleared"
zhs = "已取消每日目标，字数照常统计"
en = "daily target cleared; words are still counted"

[[message]]
# :count-target 2000
key = "progress.target-set"
zhs = "每日目标 {0} 字，保存在 {1}"
en = "daily target {0} words, kept in {1}"

# ── readonly ──────────────────────────────────────────────────────────

[[message]]
# 只讀開起來，但還有没存的改動
key = "readonly.on-with-unsaved"
zhs = "只读：开。本文件有未保存的改动，u 也无法使用"
en = "read-only: on. This file has unsaved changes, and `u` is disabled too"

[[message]]
# 只讀擋下了一次改動
key = "readonly.refused"
zhs = "只读：用 :readonly off 解除"
en = "read-only — `:readonly off` unlocks it"

[[message]]
# 只讀開關換好了
key = "readonly.set"
zhs = "只读：{0}"
en = "read-only: {0}"


# ── recover ───────────────────────────────────────────────────────────

[[message]]
# ␣o p 換項目，去不了
key = "recent.cannot-go-there"
zhs = "无法进入 {0}：{1}"
en = "cannot go to {0}: {1}"

[[message]]
# 最近開過的檔／項目
key = "recent.no-session-there"
zhs = "那里还没有会话"
en = "no session there yet"

[[message]]
# 最近開過的檔／項目，接着上次
key = "recent.nothing-to-resume"
zhs = "此目录没有上次的会话"
en = "no previous session here"

[[message]]
# 最近開過的檔／項目，接着上次
key = "recent.nothing-yet"
zhs = "还没有记录"
en = "nothing recorded yet"

[[message]]
# 開檔那一問的第二個選項：把草稿删掉
key = "recover.ask-drop"
zhs = "丢弃草稿"
en = "throw the draft away"

[[message]]
# 開檔那一問的第三個選項：草稿留着，以後再説
key = "recover.ask-later"
zhs = "暂时不管"
en = "leave it for now"

[[message]]
# 開檔那一問的第一個選項：接着問第二問
key = "recover.ask-take"
zhs = "恢复"
en = "recover"

[[message]]
# 開檔時問「要不要恢復」那一面板的標題
key = "recover.ask-title"
zhs = "发现未保存的草稿"
en = "unsaved draft found"

[[message]]
# 同一面板的正文，{0} 是檔名、{1} 是草稿的時間、{2} 是檔存檔的時間
key = "recover.ask-what"
zhs = "《{0}》有一份 {1} 的草稿，是上次未保存就退出时留下的；文件本身保存于 {2}。"
en = "'{0}' has a draft from {1}, left when the last session ended without saving; the file itself was saved at {2}."

[[message]]
# 同上，可是盤上還没有這個檔
key = "recover.ask-what-no-file"
zhs = "《{0}》有一份 {1} 的草稿，是上次未保存就退出时留下的；此文件从未保存。"
en = "'{0}' has a draft from {1}, left when the last session ended without saving; the file has never been saved."

[[message]]
# 第二問的第一個選項：真的換上去
key = "recover.confirm-go"
zhs = "直接恢复"
en = "recover it"

[[message]]
# 第二問的第二個選項：先逐詞比一遍再説
key = "recover.confirm-look"
zhs = "打开对比"
en = "compare"

[[message]]
# 第二問的第三個選項：什麽都不做
key = "recover.confirm-no"
zhs = "取消"
en = "cancel"

[[message]]
# 選了「恢復」之後再問一次，面板的標題
key = "recover.confirm-title"
zhs = "再次确认"
en = "confirm"

[[message]]
# 同一面板的正文，{0} 是檔名
key = "recover.confirm-what"
zhs = "恢复会用草稿替换当前《{0}》的全部内容。"
en = "recovering replaces all of '{0}' with the draft."

[[message]]
# 丟掉本檔案的搶救稿
key = "recover.draft-dropped"
zhs = "已丢弃草稿"
en = "draft discarded"

[[message]]
# 搶救回來的自動存檔副本，那一份緩衝區的名字
key = "recover.draft-name"
zhs = "草稿 {0}"
en = "draft {0}"

[[message]]
# 打開本檔案的搶救稿
key = "recover.draft-opened"
zhs = "草稿已打开：:w 保留，u 回到原文"
en = "draft opened: :w keeps it, u goes back"

[[message]]
# 啓動時救回没存的
key = "recover.drafts-opened"
zhs = "已打开 {0} 份未保存的草稿，用 :w <文件名> 保存"
en = "opened {0} unsaved draft(s) — :w <name> keeps them"

[[message]]
# 啓動時發現有没存的
key = "recover.drafts-waiting"
zhs = "有 {0} 份未保存的草稿，:recover 打开"
en = "{0} unsaved draft(s) — :recover opens them"

[[message]]
# 那一問上選了「暫時不管」或「取消」之後
key = "recover.left-for-now"
zhs = "之后可用 :recover 恢复"
en = "run :recover later to recover it"

[[message]]
# 本檔案没有搶救稿
key = "recover.no-draft-for-this-file"
zhs = "此文件没有草稿"
en = "no draft for this file"

[[message]]
# 自動存搶救稿失敗，帶系統理由
key = "recover.no-draft-kept"
zhs = "未保留草稿：{0}"
en = "no draft kept: {0}"


# ── register ──────────────────────────────────────────────────────────

[[message]]
# 重讀失敗
key = "reload.failed"
zhs = "无法重新加载：{0}"
en = "cannot reload: {0}"


# ── render ────────────────────────────────────────────────────────────

[[message]]
# 安全核驗的第一個選項：照存
key = "write.oversize-go"
zhs = "继续保存"
en = "save anyway"

[[message]]
# 安全核驗的第二個選項：先看改了什麼(＝ :diff)，這一存不做
key = "write.oversize-look"
zhs = "查看差异"
en = "see what changed"

[[message]]
# 安全核驗的第三個選項：不存
key = "write.oversize-no"
zhs = "取消"
en = "cancel"

[[message]]
# 安全核驗答了「取消儲存」(或按 Esc)之後説的話
key = "write.oversize-stopped"
zhs = "未保存，磁盘上的文件未改动"
en = "not saved — the file on disk is untouched"

[[message]]
# 安全核驗那扇窗的標題(:write 發現這一存把檔案撐大了很多)
key = "write.oversize-title"
zhs = "安全检查"
en = "safety check"

[[message]]
# 安全核驗的正文：説數字，不説「幅度較大」
key = "write.oversize-what"
zhs = "保存后《{0}》将从 {1} 变成 {2}，是原来的 {3} 倍。"
en = "saving would grow '{0}' from {1} to {2}, {3}× its size."
