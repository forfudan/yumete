# prefixes: buffer file recover write readonly reload autoreload recent export cd data progress encoding
#
# What the editor says, one block per tag; see README.md beside this file.

[[message]]
# 外面改了，你這裏也改了
key = "autoreload.both-changed"
zhs = "文件已被外部修改，你也有改动。:reload! 可丢弃你的改动"
en = "the file changed on disk and you have changes too — `:reload!` discards yours"

[[message]]
# 外面改了，自動重讀完成
key = "autoreload.reread"
zhs = "文件已被外部修改，已重新加载 {0}"
en = "the file changed on disk; reloaded {0}"

[[message]]
# 自動重讀開關換好了
key = "autoreload.set"
zhs = "外部修改时自动重新加载：{0}"
en = "auto-reload on outside change: {0}"


