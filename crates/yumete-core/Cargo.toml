[package]
description = "Editor core (text store, buffers, command parsing) for yumete."
edition.workspace = true
license.workspace = true
name = "yumete-core"
repository.workspace = true
version.workspace = true

[dependencies]
# **Legacy encodings** (2026-11-04): GB18030, Big5 and Shift-JIS opened and
# saved. encoding_rs is the WHATWG Encoding Standard as Firefox implements it;
# chardetng is Firefox's detector. About 0.3 MB together. The `less-slow`
# features make encoding Chinese and Japanese about ten times faster.
encoding_rs = { version = "0.8.42", features = ["less-slow-gb-hanzi-encode", "less-slow-big5-hanzi-encode", "less-slow-kanji-encode"] }
chardetng = "1.0.0"
# ripgrep's directory walker (#362). What it buys is `.gitignore`: the hand-
# written skip list it replaces was three names and an extension table, it did
# not read the ignore file sitting right there, and it was never going to be
# complete. Only the *walking* half of ripgrep — the matching is still `regex`,
# which is the very same engine, and a grep here has to read unsaved buffers
# anyway, which no external tool can see.
ignore = "0.4"
regex = "1"
# helix's `:reflow` is this crate's `refill`, and copying it means calling it
# with helix's own options (helix-core/src/wrap.rs).
textwrap = "0.16"
regex-syntax = "0.8"
serde = {version = "1", features = ["derive"]}
# The only new dependency the language-server work takes (#53/#54). Everything
# on that wire is JSON, and it was already in the lock file.
serde_json = "1"
toml = "0.8"
ropey = { version = "1.6", default-features = false, features = ["simd"] }
yumete-cjk = {path = "../yumete-cjk"}

# Code inside a fence, coloured by its own grammar (#420). Only the fence is
# parsed — never the manuscript — so the per-paragraph caches keep their shape.
# Seven grammars, 1.34 MB between them, at first; bash (1.3 MB alone) and the
# TIOBE ten (+13 MB) were measured and left out. On 2026-10-29 TypeScript/TSX,
# C++, Bash and Lua went in for +7.6 MB (22.1 MB to 29.9 MB), chosen with that
# figure in hand.
streaming-iterator = "0.1"
tree-sitter = "0.25"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
# **這一份是我們自己的**（2026-10-11 發的）：`forfudan/tree-sitter-mojo`，
# 從零寫起而不是 fork `tree-sitter-python`。v0.4.0 (2026-11-04) reads Mojo 1.2:
# 99.77% of the real Mojo in Modular's 1.2 sources, 99.75% of 1.1's.
tree-sitter-mojo = { git = "https://github.com/forfudan/tree-sitter-mojo", tag = "v0.4.0" }
# **Ours as well** (2026-11-08): `forfudan/tree-sitter-typst`, written from
# Typst's own lexer and parser and Apache-2.0 like this repository. It colours
# the tokens of a Typst manuscript; telling prose from code stays with the
# block scanner in `markdown::typst`.
tree-sitter-typst = { git = "https://github.com/forfudan/tree-sitter-typst", tag = "v0.1.1" }
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-r = "1.3"
tree-sitter-asm = "0.24"
tree-sitter-ada = "0.1"
tree-sitter-pascal = "0.10"
tree-sitter-typescript = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-bash = "0.25"
tree-sitter-lua = "0.2"

# `localtime_r` — the offset a dated file name is read in. Already in the lock
# file by way of ratatui, so it costs no build.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `GetFileInformationByHandle` — the only way to ask NTFS whether two paths are
# one file, since the standard library keeps the answer behind an unstable
# trait — `GetLocalTime`, which is that same offset, and `OpenProcess` for
# 「is the process that left this draft still running」 (there are no signals to
# borrow there). Already in the lock file by way of crossterm, so it costs no
# build.
[target.'cfg(windows)'.dependencies]
windows-sys = {version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Threading"]}

[build-dependencies]
# **The interface's Traditional Chinese is made at build time** (2026-11-07,
# build.rs): OpenCC's s2t, then the 大陸通規 glyph table, for every message
# without a hand-written `zht`, and t2s to check the ones with one. A pure-Rust
# OpenCC with its dictionaries built in, so no machine needs opencc installed.
ferrous-opencc = "0.4.0"
