# What the editor says, in both languages — Feature #151.
#
# One block per message. `zh` is what the code says, **verbatim**: it is the key
# the translation is looked up by, so do not edit it here — edit it where it is
# said, and change it here to match. `en` is the translation, and is the only
# line this file exists for.
#
# `{0}` `{1}` are the values the message is given, **numbered** so a translation
# may put them in the other order — 「{0} 個檔案裏都沒有「{1}」」 is "no 「{1}」 in
# {0} file(s)". Both languages must use the same set of holes; a test checks it.
# An `en` left empty falls back to the Chinese, which is what the editor did
# before this file existed.
#
# The register to match is `README.md` and `--help`: plain, short, lower-case
# unless a name starts the line, no exclamation marks, and it says what happened
# rather than apologising for it. Where the Chinese uses a term of the art — 縱,
# 拆分, 所見即所得 — the English keeps it: it is the word, and a reader of this
# editor is going to meet it anyway.
#
# `[editor] language = "zh"` (the default) or `"en"`.

