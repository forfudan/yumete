[package]
description = "Terminal UI (crossterm + ratatui) for yumete."
edition.workspace = true
license.workspace = true
name = "yumete-tui"
repository.workspace = true
version.workspace = true

[dependencies]
# `unstable-backend-writer` for `writer_mut`: `backend.rs` writes the dotted
# underline (#287) past the crossterm backend, into the same stdout.
ratatui = { version = "0.29", features = ["unstable-backend-writer"] }
yumete-cjk = {path = "../yumete-cjk"}
yumete-config = {path = "../yumete-config"}
yumete-core = {path = "../yumete-core"}
yumete-ime = {path = "../yumete-ime"}
# The rendered Markdown preview: its colours come from the
# editor's palette (`preview_theme`) and its formulas from `tex`.
yumete-mdview = {path = "../yumete-mdview"}

# **TeX formulas as pictures**: KaTeX's layout in Rust, with
# KaTeX's fonts built in (`embed-fonts`), for Markdown's formulas in the
# formula float. In the process and well under a millisecond a formula,
# where the `typst` command and the bundled `mitex` package it replaces took
# 5 to 20 ms and a `typst` on `PATH`. MIT; the fonts are OFL
# (`licenses/katex-fonts.LICENSE`).
ratex-layout = "0.1.15"
ratex-parser = "0.1.15"
ratex-render = { version = "0.1.15", features = ["embed-fonts"] }
ratex-types = "0.1.15"
# Where RaTeX finds a font for a 漢字, asked for here once under a quiet
# standard error, so that no later render has to point it away (`tex.rs`).
ratex-unicode-font = "0.1.15"

# **The preview's page in the theme's colours** (`:preview-theme`): the PNG tinymist hands over is read, each pixel
# mapped from paper and ink to the theme's, and written again. Already in
# the tree under `ratex-render`; MIT or Apache-2.0.
png = "0.17"

# Only the tests read JSON here: what this crate *sends* is built by
# `yumete_core::lsp` out of literals, and the tests check that what came out
# really is the message it claims to be.
[dev-dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `SetConsoleCtrlHandler`, so `:!` can take `C-c` without the editor taking it
# too — see `run_in_the_terminal`. 0.61 because the tree already carries that
# version (`ignore` -> `winapi-util`), and it links through the small
# `windows-link` rather than pulling the whole `windows-targets` set.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Foundation"] }
