[package]
description = "Terminal UI (crossterm + ratatui) for yumete."
edition.workspace = true
license.workspace = true
name = "yumete-tui"
repository.workspace = true
version.workspace = true

[dependencies]
# `unstable-backend-writer` for `writer_mut`: `backend.rs` writes the dotted
# underline (#287) past the crossterm backend, into the same stdout.
ratatui = { version = "0.29", features = ["unstable-backend-writer"] }
yumete-cjk = {path = "../yumete-cjk"}
yumete-config = {path = "../yumete-config"}
yumete-core = {path = "../yumete-core"}
yumete-ime = {path = "../yumete-ime"}

# Only the tests read JSON here: what this crate *sends* is built by
# `yumete_core::lsp` out of literals, and the tests check that what came out
# really is the message it claims to be.
[dev-dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
