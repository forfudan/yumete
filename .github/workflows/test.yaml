name: Tests

# **Run the tests on every push, not only on a release.**
#
# They already ran inside `release.yaml`, which is the one build where a red
# test must not get past — but that is `on: release: published`, so between two
# releases nothing checks anything. 2026-09-27 a test in `yumete-tui` turned out
# to have been failing since 09-10: seventeen days in which the thing it checks
# was not being checked (`docs/development.md` §5.12.58).
#
# Warning: **Three rows, and the second one is the point.** That particular test was
# **green on Linux and red on macOS** — it read a process-global (the theme's
# light/dark mood) before anything settled it, so which machine saw it red came
# down to which thread ran first. One runner would have gone on saying green.
# Both are free here: `forfudan/yumete` is public — and so is the third,
# Windows, added 2026-10-12 when that side started shipping. It is the row most
# likely to find something: every other `cfg` in the tree has one arm nobody
# runs, and the paths there use the other separator.
#
# **The tables the binary carries are built here too** (2026-11-04): the
# `yumete` binary depends on `yumete-tables`, whose build script fetches Yume's
# macOS package once. The directory is cached between runs, so a run pays for
# the download only when the cache is cold, and `yumete-ime/tests/carried.rs`
# checks that the binary can type with them.
on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    # **A pull request from a fork cannot read secrets**, and the sibling
    # checkout below needs one — so such a PR would fail on the checkout and
    # say nothing about the code. The push that follows a merge covers it.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Everything runs inside this repository's own checkout — see `release.yaml`
    # for why there are two side by side.
    # Warning: **`shell:` has to be repeated here.** A job-level `defaults.run`
    # replaces the workflow-level one rather than merging key by key, so this
    # block — which only means to say *where* commands run — was also quietly
    # saying 「and in whatever shell the runner prefers」. On Linux and macOS
    # that is bash either way, so it stayed hidden until a Windows row ran the
    # sibling-key guard through PowerShell and got
    # 「Missing '(' after 'if'」 (2026-10-12).
    defaults:
      run:
        shell: bash
        working-directory: yumete
    # Where `yumete-tables` keeps the tables, and a token for the one GitHub
    # API call it makes to find the package, so a shared runner address is
    # not rate limited.
    env:
      YUMETE_BUILTIN_DIR: ${{ github.workspace }}/yume-tables
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: yumete

      # The sibling. `yumete-ime` depends on `yume-core` by path
      # (`../../../yume/crates/yume-core`), so a checkout of this repository
      # alone does not build: `cargo metadata` fails before a single crate is
      # compiled.
      - name: Check that the sibling can be read
        working-directory: .
        run: |
          set -euo pipefail
          if [[ -z "${YUME_DEPLOY_KEY}" ]]; then
            echo "!! no YUME_DEPLOY_KEY secret." >&2
            echo "   forfudan/yume is private, so GITHUB_TOKEN cannot read it." >&2
            echo "   Put a read-only deploy key for that repository in the" >&2
            echo "   YUME_DEPLOY_KEY secret — the same one release.yaml uses." >&2
            exit 1
          fi
        env:
          YUME_DEPLOY_KEY: ${{ secrets.YUME_DEPLOY_KEY }}

      - uses: actions/checkout@v4
        with:
          repository: forfudan/yume
          path: yume
          ssh-key: ${{ secrets.YUME_DEPLOY_KEY }}

      # The docs site. The tests that hold the documents to the editor read its
      # pages (`crates/yumete-core/tests/site/mod.rs`), and the step at the end
      # checks its generated tables. It is public, so no key.
      - uses: actions/checkout@v4
        with:
          repository: forfudan/yumete-docs
          path: yumete-docs

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}
          workspaces: yumete

      # The cache follows Yume's release: a new package is a new key, so
      # tables in a format this yume-core no longer reads do not linger.
      - name: Which Yume package
        id: yume-package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(gh api repos/forfudan/yume-release/releases/tags/yuhao \
            --jq '[.assets[].name | select(endswith("-macos-arm64.zip"))][0] // empty' || true)
          # No package found: a key of this run's own, so nothing sticks.
          echo "name=${name:-none-${{ github.run_id }}}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: yume-tables
          key: yume-tables-${{ matrix.os }}-${{ steps.yume-package.outputs.name }}

      # `--locked` so a stale `Cargo.lock` is a failure here rather than a
      # surprise in `release.yaml`, which builds with it too.
      #
      # Warning: **`--no-fail-fast`**: the red rows come first in cargo's output and a
      # run that stops at the first one hides how many there are — which is how
      # 「only one test is red」 turned out to be twelve once already
      # (「別再踩」 in ../CLAUDE.md).
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

      # **The site's tables are the editor's own** (`ye --docgen`): commands,
      # keys, settings and languages, written from the tables the editor runs
      # on. A difference here means the code moved and the docs did not:
      # regenerate them into yumete-docs and commit them there. One row is
      # enough; the tables do not depend on the platform.
      - name: Docs tables are current
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          cargo run -q --locked -p yumete -- --docgen=../yumete-docs/src/generated
          if [[ -n "$(git -C ../yumete-docs status --porcelain -- src/generated)" ]]; then
            git -C ../yumete-docs status --short -- src/generated
            git -C ../yumete-docs diff -- src/generated | head -80
            echo "!! the docs tables are stale: run 'ye --docgen=../yumete-docs/src/generated' and commit them in yumete-docs" >&2
            exit 1
          fi
