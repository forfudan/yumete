name: Build release tarballs

# Builds the `yumete` binary for every platform it ships on, packaged as
# release tarballs that the Homebrew formula in
# https://github.com/forfudan/homebrew-tap downloads.
#
#   yumete-<version>-darwin-arm64.tar.gz
#   yumete-<version>-linux-x86_64.tar.gz
#   yumete-<version>-linux-aarch64.tar.gz
#   yumete-<version>-windows-x86_64.zip
#
# **A zip on Windows, and nothing else.** Explorer opens one with nothing
# installed, and both package managers on that side expect one: `scoop` reads
# it straight (`extract_dir` ＋ `bin` shims) and `winget` takes it as
# `InstallerType: zip` with `NestedInstallerType: portable`. Windows 10 has
# `tar`, but nothing over there reaches for it.
#
# Warning: **The IME data is not in them** ([^135]). It is 36 MB compressed, it is
# **platform-independent** — yume's own `fetch_data_linux.sh` says so, and
# takes the Linux files out of the macOS release — so bundling it here would
# build one thing three times and make every reader download it three times.
# It travels its own way: yume's own install, a `yume-data` formula, or
# `$YUME_DATA_DIR`. An editor with no tables is still an editor.
#
# Warning: **Two repositories are checked out, side by side.** `yumete-ime` depends
# on `yume-core` by path — `../../../yume/crates/yume-core` — so a checkout of
# this repository alone does not build: `cargo metadata` fails before a single
# crate compiles. `forfudan/yume` is private and `GITHUB_TOKEN` cannot read it,
# so the run needs a **read-only deploy key** for that repository, held as the
# `YUME_DEPLOY_KEY` secret. A deploy key rather than a PAT because it does not
# expire and it reaches exactly one repository — a token that quietly lapses in
# a year is a release that fails on the day you least want it to. The guard
# below says so in one line rather than letting cargo say it in twenty.
#
#   $GITHUB_WORKSPACE/
#     yumete/   ← this repository, and every `run:` works from here
#     yume/     ← the sibling, source only (no `data/` — nothing needs it)
#
# Two ways in:
#
#   * publish a GitHub Release, and the version is its tag without the `v`.
#     The tarballs and their SHA-256 files are attached to that release
#     automatically. This is how a real release goes out, and the tag has to
#     match `Cargo.toml` or the run stops — a tarball whose name disagrees
#     with the binary inside it is worse than no tarball.
#   * by hand from the Actions tab, where the version may be given and
#     otherwise comes from `Cargo.toml`. A manual run keeps the tarballs as
#     artifacts and attaches nothing, since there may be no release to attach
#     them to.
#
# Warning: The release page is live from the moment it is published, and the assets
# arrive minutes later — a reader (or a tap) who looks in between sees a
# release with nothing on it. **Do the manual run first**, look at the
# artifacts, then publish the release; the build is cached by then and the
# window is short.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, e.g. 0.1.0 (empty: Cargo.toml)"
        required: false
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # One version for the whole run, resolved once, so the three build jobs
  # cannot disagree about what they are packaging.
  version:
    name: Pick the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
    # Everything runs inside this repository's own checkout — see the header
    # for why there are two. Steps that need the workspace root say so with
    # `working-directory: .`, which is resolved against `$GITHUB_WORKSPACE`.
    # Warning: **`shell:` has to be repeated here.** A job-level `defaults.run`
    # replaces the workflow-level one rather than merging key by key, so this
    # block — which only means to say *where* commands run — was also quietly
    # saying 「and in whatever shell the runner prefers」. On Linux and macOS
    # that is bash either way, so it stayed hidden until a Windows row ran the
    # sibling-key guard through PowerShell and got
    # 「Missing '(' after 'if'」 (2026-10-12). Same in `test.yaml`.
    defaults:
      run:
        shell: bash
        working-directory: yumete
    steps:
      - uses: actions/checkout@v4
        with:
          path: yumete
      - id: pick
        run: |
          set -euo pipefail
          # The workspace's own version, which every crate inherits.
          crate=$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ -z "$crate" ]]; then
            echo "!! no version in Cargo.toml" >&2
            exit 1
          fi
          case "${{ github.event_name }}" in
            release)
              tag="${{ github.event.release.tag_name }}"
              version="${tag#v}"
              # **The tag and the crate must agree.** A tarball called
              # 0.2.0 holding a binary that says 0.1.0 is a bug report
              # nobody can act on.
              if [[ "$version" != "$crate" ]]; then
                echo "!! tag $tag says $version, Cargo.toml says $crate" >&2
                exit 1
              fi
              ;;
            *)
              version="${{ inputs.version }}"
              version="${version:-$crate}"
              tag="v$version"
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "packaging $version (tag $tag)"

  build:
    name: Build ${{ matrix.target }} tarball
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 on both Linux rows so the binaries run against an older
          # glibc (2.35). A newer runner would raise the floor for no gain.
          - os: ubuntu-22.04
            target: linux-x86_64
            ext: tar.gz
          - os: ubuntu-22.04-arm
            target: linux-aarch64
            ext: tar.gz
          - os: macos-14          # Apple Silicon (arm64)
            target: darwin-arm64
            ext: tar.gz
          # Warning: **`+crt-static` is not a tuning flag here.** Without it the
          # binary wants `VCRUNTIME140.dll`, and a reader who unpacked a zip
          # has no installer to pull the redistributable in — the report is
          # 「it says a DLL is missing」, which says nothing about this program.
          # Static CRT makes the one file the whole package. (Nothing links a
          # C++ DLL of ours; the tree-sitter grammars are C, and `cc` follows
          # the same flag.)
          - os: windows-latest
            target: windows-x86_64
            ext: zip
            rustflags: "-C target-feature=+crt-static"
    # **Test and build share one environment**, so what was tested is what
    # ships. Two of these matter:
    #
    #   * `YUMETE_RELEASE` makes `crates/yumete/build.rs` emit a bare `0.1.0`.
    #     Without it the binary says `0.1.0-dev.20260914…+1f6aeb2` inside a
    #     tarball called `0.1.0` — and SemVer sorts that *before* the release.
    #   * `YUMETE_BUILTIN_DIR` is where the tables fetched below are put, and
    #     naming it makes both `build.rs`es look **only** there. That is what
    #     makes the package deterministic: a runner image that one day happens
    #     to carry a 宇浩 data directory cannot silently put a different 碼表
    #     into a release.
    env:
      YUMETE_RELEASE: "1"
      YUMETE_BUILTIN_DIR: ${{ github.workspace }}/yumete-data
      # Empty on every row but Windows, which is the same as unset — there is
      # no `.cargo/config.toml` in this tree for it to clobber.
      RUSTFLAGS: ${{ matrix.rustflags }}
    # `shell:` repeated for the reason given above.
    defaults:
      run:
        shell: bash
        working-directory: yumete
    steps:
      - uses: actions/checkout@v4
        with:
          path: yumete

      # The sibling. Source only — `yume-core` is a library, and none of its
      # build scripts want `data/`.
      - name: Check that the sibling can be read
        working-directory: .
        run: |
          set -euo pipefail
          if [[ -z "${YUME_DEPLOY_KEY}" ]]; then
            echo "!! no YUME_DEPLOY_KEY secret." >&2
            echo "   yumete-ime depends on yume-core by path (../../../yume)," >&2
            echo "   and forfudan/yume is private, so GITHUB_TOKEN cannot read" >&2
            echo "   it. Put a read-only deploy key for that repository in the" >&2
            echo "   YUME_DEPLOY_KEY secret (the private half; the public half" >&2
            echo "   goes on forfudan/yume under Settings > Deploy keys)." >&2
            exit 1
          fi
        env:
          YUME_DEPLOY_KEY: ${{ secrets.YUME_DEPLOY_KEY }}

      - uses: actions/checkout@v4
        with:
          repository: forfudan/yume
          path: yume
          ssh-key: ${{ secrets.YUME_DEPLOY_KEY }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: yumete

      # Warning: **The 碼表 and the word list are build inputs, not tracked files.**
      # Both are generated — `lingming_essential.ytab` cut from 宇浩's own
      # 碼表, `common_words.txt` from its language model — and a generated
      # table rewritten whole on every refresh costs the repository its full
      # size again each time. So they live on a release page, and the binary
      # picks them up here.
      #
      # `forfudan/yume-release` is public, so this needs no token (checked
      # 2026-09-14: `visibility: PUBLIC`, an anonymous ranged GET returns 206).
      # The tag is fixed and the assets are overwritten in place, so there is
      # one URL for all time and nothing to bump here when the tables change.
      #
      # Warning: **A missing table fails the run** (2026-10-04). A bare
      # `cargo build` with no 碼表 is honest — it is what somebody who has
      # never installed 宇浩 gets. **A release with no 碼表 is not**: it is a
      # package that silently cannot type, and the reader has no way to tell
      # it from one that can.
      #
      # This step used to end in `|| true` and say so in a comment: 「a release
      # that cannot type is caught by the smoke test」. That was **false** —
      # the smoke test only checked `--version` and that a page is drawn. On
      # 2026-10-03 the x86_64 runner's `curl` for `lingming_essential.ytab`
      # came back empty (`--retry 3` and all), the step shrugged, and what
      # caught it was an unrelated TUI unit test asserting the scheme tag is
      # on the status line. The two halves are now both real: this step stops,
      # and the smoke test below actually types a 漢字.
      - name: Fetch the tables the binary carries
        working-directory: .
        env:
          TAG: yumete-data
          FROM: forfudan/yume-release
        run: |
          set -uo pipefail
          # Warning: **`$GITHUB_WORKSPACE` is a Windows path on that runner**
          # (`D:\a\yumete`), and the shell here is git-bash, where a backslash
          # inside quotes stays a literal character — `mkdir -p` would make one
          # directory whose *name* contains them. `cygpath` is what git-bash
          # ships for exactly this. The build itself keeps the native path:
          # it is `build.rs` that reads the variable, and Rust wants it that way.
          dir="${YUMETE_BUILTIN_DIR}"
          command -v cygpath > /dev/null && dir=$(cygpath -u "${dir}")
          mkdir -p "${dir}/schemes" "${dir}/data"
          base="https://github.com/${FROM}/releases/download/${TAG}"
          get() { curl -fsSL --retry 3 --retry-delay 2 -o "$2" "${base}/$1"; }
          get lingming_essential.ytab "${dir}/schemes/lingming_essential.ytab" || true
          get xingchen_essential.ytab "${dir}/schemes/xingchen_essential.ytab" || true
          get symbols.ytab            "${dir}/data/symbols.ytab" || true
          get common_words.txt        "${dir}/data/common_words.txt" || true
          get chaifen.ydiv            "${dir}/data/chaifen.ydiv" || true
          get VERSION                 "${dir}/VERSION" || true
          # A half-written file is worse than none: the loader would take a
          # truncated table and answer nonsense from it. Weigh each one and
          # throw away anything that plainly did not arrive whole.
          # Warning: **星陳 was fetched by nobody** (2026-10-12). `build.rs` looks
          # **only** in `YUMETE_BUILTIN_DIR` when that is set — which this job
          # sets — so a table this step does not fetch is a table the release
          # does not carry, however happily `build.rs` would have fetched it on
          # a developer's machine. The asset has been on that release since
          # 2026-10-07; this step simply never asked for it, and every release
          # so far ships a 星陳 that cannot type.
          short=0
          for f in schemes/lingming_essential.ytab schemes/xingchen_essential.ytab \
                   data/symbols.ytab data/common_words.txt data/chaifen.ydiv; do
            p="${dir}/$f"
            if [[ ! -s "$p" ]] || [[ $(wc -c < "$p") -lt 10000 ]]; then
              echo "!! ${f}: missing, or too small to be it — dropped" >&2
              rm -f "$p"
              short=1
            fi
          done
          # Warning: **a size is not a format.** 「拆分表」 is a `.ydiv`, and its
          # magic has been bumped once already (`YDV20260828` → `YDV20260904`,
          # 2026-09); an old file is refused by `from_binary` at *run* time and
          # the symptom is 「the annotations are simply gone」. Sniff the three
          # letters here — the version is deliberately **not** pinned, because
          # the table and the reader move together and a pinned number would
          # fail a release that is perfectly correct. What catches a stale
          # version is the smoke test below, which asks the built binary for a
          # real 拆分.
          if ! head -c 3 "${dir}/data/chaifen.ydiv" | grep -q YDV; then
            echo "!! chaifen.ydiv does not begin YDV — not a division table" >&2
            short=1
          fi
          ls -l "${dir}"/schemes "${dir}"/data
          if [[ "$short" == 1 ]]; then
            echo "!! a release without its tables is a package that cannot type." >&2
            echo "   the download is the usual suspect (it has flaked once per" >&2
            echo "   runner, not per release) — re-run this job." >&2
            exit 1
          fi

      # **The tests run here too.** A release built from a tree that does not
      # pass them is the one build where nobody would notice in time.
      # `--locked` here as well as on the build: without it this step quietly
      # repairs a stale `Cargo.lock` and the `--locked` below never sees it.
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

      - name: Build
        run: cargo build --release --locked -p yumete

      # The `.exe` spelt out: git-bash does append it when it resolves a path,
      # but a release step is the wrong place to lean on that.
      - name: Say what went in
        run: ./target/release/yumete${{ runner.os == 'Windows' && '.exe' || '' }} --version

      - name: Package
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          PKG="yumete-${VERSION}-${{ matrix.target }}"
          STAGE="dist/${PKG}"
          EXE=""
          [[ "${{ runner.os }}" == Windows ]] && EXE=".exe"
          mkdir -p "${STAGE}/bin" "${STAGE}/docs"
          cp "target/release/yumete${EXE}" "${STAGE}/bin/"
          # Warning: No `2>/dev/null || …` here. It used to fall back to copying only
          # the README, so the day LICENSE moved, an Apache-2.0 project would
          # have shipped tarballs with no licence text and a green build.
          # `set -e` and a loud failure is the right answer.
          #
          # **The licence and nothing else** (2026-10-17 作者定：「Why dont we
          # just put only the binary in the release package? It is just a beta
          # stage.」). The README and the changelog are a click away on the
          # page this tarball is attached to. The licence is not optional in
          # the same way: Apache-2.0 §4(a) says a copy travels with the thing
          # you hand over, so it stays however early the version is.
          cp LICENSE "${STAGE}/"
          # The manual travels with it: this editor's keys are not vi's, and a
          # reader who installed it from a tap has nowhere else to look. It
          # keeps its repository path, so `README.md`'s own link to
          # `docs/manual.md` still resolves inside the tarball.
          #
          # Warning: **English only now** (2026-10-17 作者定). It used to carry the 简体
          # manual too, 「so half the readers are not reading the other half's
          # characters」 — but the two Chinese manuals left the repository that
          # day (they live in `local/`, which git does not track), so a CI
          # checkout has nothing to copy and the build stopped here. The
          # Chinese manuals are on the website; the English one is the source
          # text and travels with the binary.
          cp docs/manual.md "${STAGE}/docs/"
          # See the header for why Windows gets a zip. `7z` is on that image;
          # `-mx=9` because this travels over a package manager's network, not
          # ours.
          case "${{ matrix.ext }}" in
            zip) ( cd dist && 7z a -tzip -mx=9 "${PKG}.zip" "${PKG}" > /dev/null ) ;;
            *)   ( cd dist && tar -czf "${PKG}.tar.gz" "${PKG}" ) ;;
          esac
          # From inside `dist/`, so the file records a bare name and
          # `shasum -c` works where the reader unpacked it. Piped through
          # `tee` the path would be `dist/yumete-…`, which resolves nowhere.
          #
          # `shasum` is perl's and is not on every image; `sha256sum` is
          # coreutils'. Both print the same two fields in the same order, so
          # whichever is there writes a file the other can check.
          sum() { if command -v shasum > /dev/null; then shasum -a 256 "$1"; else sha256sum "$1"; fi; }
          ( cd dist && sum "${PKG}.${{ matrix.ext }}" | tee "${PKG}.${{ matrix.ext }}.sha256" )

      # Run it from somewhere unrelated to the build, so a binary that only
      # works beside its own build tree is caught here rather than by a reader.
      - name: Smoke-test the packaged binary
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          PKG="yumete-${VERSION}-${{ matrix.target }}"
          EXE=""
          [[ "${{ runner.os }}" == Windows ]] && EXE=".exe"
          YE="$RUNNER_TEMP/elsewhere/${PKG}/bin/yumete${EXE}"
          mkdir -p "$RUNNER_TEMP/elsewhere"
          cp -R "dist/${PKG}" "$RUNNER_TEMP/elsewhere/"
          # The binary must say exactly the version the tarball is named for.
          # `--version` prints `yumete <version> — …`, so match the field.
          got=$("$YE" --version)
          echo "$got"
          case "$got" in
            "yumete ${VERSION} "*|"yumete ${VERSION}") ;;
            *) echo "!! binary says ${got}, tarball says ${VERSION}" >&2; exit 1 ;;
          esac
          # …and it draws a page. `--shot` runs the whole launch, so this
          # catches a binary that starts and then cannot render.
          #
          # Warning: **no `tee /dev/stderr`** (2026-10-12). git-bash has no such
          # path, and the whole smoke test died on it after the package, the
          # version and the 碼表 had all checked out. Hold the frame in a
          # variable and print it, which is what the half below already does.
          printf '那年冬天。\n' > "$RUNNER_TEMP/a.md"
          drawn=$("$YE" --shot=40x6 "$RUNNER_TEMP/a.md")
          printf '%s\n' "$drawn" >&2
          printf '%s' "$drawn" | grep -q '那年冬天'
          # …**and it can type** (2026-10-04). `\{ime}` hands the keys that
          # follow to the engine, so this walks the whole path the tables are
          # fetched for: 碼表 loaded, code read, candidate chosen, 漢字 on the
          # page. An empty file, so the only 漢字 there can be is one the
          # engine put there.
          : > "$RUNNER_TEMP/b.md"
          typed=$("$YE" --shot=70x6 --keys='i\{ime}ui\{space}\{ime}' "$RUNNER_TEMP/b.md")
          printf '%s\n' "$typed" >&2
          # The scheme's name on the status line is what says the 碼表 loaded —
          # it is exactly what was missing the day this check was written.
          if ! printf '%s' "$typed" | grep -q '靈明'; then
            echo "!! no 碼表 in this build: the status line names no scheme" >&2
            exit 1
          fi
          # And a 漢字 really landed. **Not a particular one** — the table is
          # refreshed in place, and a smoke test that pins a character would
          # fail the day 不 stops being the first candidate for `ui`.
          #
          # `python3` on the Windows image is `python`, so ask for whichever
          # answers rather than hard-coding the name of one of them.
          py=python3
          command -v python3 > /dev/null || py=python
          # Warning: **read bytes and say UTF-8** (2026-10-12). `sys.stdin` takes
          # the console's code page on Windows, so the 漢字 this line exists to
          # find came back as cp1252 mojibake — **no error, just an answer of
          # 「none」** while the frame above it plainly showed 不是.
          # …**and it knows what a 漢字 is made of** (2026-10-12). `空格 n` reads
          # the 全息拆分表, which is a different file from the 碼表 and arrived
          # by a different route — a package can type perfectly and still answer
          # 「碼表沒載」 to this. Measured the day it was added: the CI build said
          # exactly that while the one built on a machine with 宇浩 installed
          # answered 「宇浩全息拆分 且 / 讀音 zǔ zhù」.
          #
          # This is also the check that catches a `.ydiv` whose magic has moved
          # on: the fetch step can only see that the file is a division table,
          # not that *this* reader accepts it.
          printf '阻\n' > "$RUNNER_TEMP/c.md"
          split=$("$YE" --shot=60x12 --keys='\{space}n' "$RUNNER_TEMP/c.md")
          printf '%s\n' "$split" >&2
          if ! printf '%s' "$split" | grep -q '宇浩全息拆分'; then
            echo "!! no 拆分表 in this build: 空格 n has nothing to say about 阻" >&2
            exit 1
          fi
          if ! printf '%s' "$typed" | head -1 | "$py" -c \
            'import sys; t = sys.stdin.buffer.read().decode("utf-8", "replace"); sys.exit(0 if any("\u4e00" <= c <= "\u9fff" for c in t) else 1)'; then
            echo "!! the engine put no 漢字 on the page" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: yumete-${{ needs.version.outputs.version }}-${{ matrix.target }}
          # Warning: `path:` is resolved against `$GITHUB_WORKSPACE`, **not** against
          # `defaults.run.working-directory` — so it carries the checkout
          # directory even though every `run:` above does not.
          path: yumete/dist/yumete-${{ needs.version.outputs.version }}-${{ matrix.target }}.${{ matrix.ext }}*
          if-no-files-found: error
          retention-days: 14

  # The step that is easy to forget by hand — and decimo's own notes say it
  # was forgotten for three releases running, which left Homebrew four months
  # behind. `--clobber` so re-running a release replaces the assets rather
  # than failing on the second attempt.
  attach:
    name: Attach the tarballs to the release
    if: github.event_name == 'release'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: yumete-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - name: Upload to the release
        run: |
          set -euo pipefail
          # `nullglob` and an explicit list, because the rows do not all have
          # the same suffix any more and `fail-fast: false` means one platform
          # can be missing. An unmatched glob would otherwise reach `gh` as a
          # literal `dist/*.zip` and be reported as a missing file — true, but
          # about the wrong thing.
          shopt -s nullglob
          files=(dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.zip dist/*.zip.sha256)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "!! no packages were built — nothing to attach." >&2
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" \
            --clobber --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets -q '.assets[].name'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
