[workspace]
members = [
  "crates/yumete-core",
  "crates/yumete-cjk",
  "crates/yumete-config",
  "crates/yumete-ime",
  "crates/yumete-tui",
  "crates/yumete",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/forfudan/yumete"
version = "0.1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# **A crash report nobody can read is half a feature** (#300). `strip = true`
# takes the symbol table with it, and the backtrace in `yumete.log` comes out
# as a column of `__mh_execute_header`. Dropping only the debug info keeps the
# names — nothing about the generated code changes.
strip = "debuginfo"
