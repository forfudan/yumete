[workspace]
members = [
  "crates/yumete-core",
  "crates/yumete-cjk",
  "crates/yumete-config",
  "crates/yumete-ime",
  "crates/yumete-tui",
  "crates/yumete",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/forfudan/yumete"
version = "0.3.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# **A crash report nobody can read is half a feature** (#300). `strip = true`
# takes the symbol table with it, and the backtrace in `yumete.log` comes out
# as a column of `__mh_execute_header`. Dropping only the debug info keeps the
# names — nothing about the generated code changes.
strip = "debuginfo"

# **改一行等三分鐘，是調試信息的錢**（2026-09-23 量的）。默認的 `debug = true`
# 給每個符號生成完整 DWARF，一個一萬七千行的 crate 每次重編＋重鏈都要付一遍。
#
# `line-tables-only` 留下回溯要的那一半——`yumete.log` 裏的 `file:line` 一行不
# 少（#300 那條「崩潰報告要讀得懂」照舊成立），丟掉的是在 lldb 裏看變量的能力，
# 而這個項目從來不那樣調試。
[profile.dev]
debug = "line-tables-only"

# **`target/debug/deps` 裏兩百一十萬個檔，其中 99.3% 是 `.rcgu.o`**（2026-09-27
# 量的）。macOS 上 dev 的 `split-debuginfo` 默認是 `unpacked`：調試信息留在每個
# 代碼生成單元的目標檔裏，所以那些 `.o` **必須留着**，而檔名帶着每次編譯的哈希
# ——每重編一次就新寫一套，舊的永遠不刪。dev 的 codegen-units 是 256，編幾百次
# 就是幾百萬個。一個目錄裏兩百萬條，APFS 查一個名字都慢，於是每一次構建都在等
# 磁盤（實測 rustc 停在 `UN`，不可中斷的磁盤等待，CPU 5%）。
#
# `packed` 讓 `dsymutil` 把調試信息收進一個 `.dSYM`，那些 `.o` 就不必留了。
# Warning: **回溯照舊讀得懂**（#300）：`line-tables-only` 那一半原樣還在，只是換了個
# 地方放。代價是每次鏈接多跑一趟 dsymutil。
split-debuginfo = "packed"
